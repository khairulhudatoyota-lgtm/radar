let car3D = null;

function disposeCar3D(){
  if(car3D){
    if(car3D.raf) cancelAnimationFrame(car3D.raf);
    if(car3D.renderer){ try{ car3D.renderer.dispose(); }catch(e){} }
    car3D = null;
  }
}

function init3DCarDiagram(){
  disposeCar3D();
  const container = document.getElementById('car3dCanvas');
  if(!container) return;
  try{
    if(typeof THREE === 'undefined' || typeof THREE.GLTFLoader === 'undefined') throw new Error('THREE/GLTFLoader not loaded');

    container.innerHTML = "";
    const W = container.clientWidth || 300;
    const H = 250;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, W/H, 0.1, 100);
    camera.position.set(0, 3.2, 6.4);
    camera.lookAt(0, 0.6, 0);

    const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.domElement.style.display = "block";
    renderer.domElement.style.width = "100%";
    renderer.domElement.style.touchAction = "none";
    renderer.domElement.style.cursor = "grab";
    container.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0xb0b8c4, 0.85));
    const dir = new THREE.DirectionalLight(0xffffff, 0.7);
    dir.position.set(3.5, 6, 3);
    dir.castShadow = true;
    dir.shadow.mapSize.set(1024,1024);
    dir.shadow.camera.left=-3; dir.shadow.camera.right=3; dir.shadow.camera.top=3; dir.shadow.camera.bottom=-3;
    dir.shadow.camera.near=1; dir.shadow.camera.far=12;
    scene.add(dir);
    const fill = new THREE.DirectionalLight(0xffffff, 0.3);
    fill.position.set(-3,3,-3);
    scene.add(fill);

    const ground = new THREE.Mesh(new THREE.CircleGeometry(3.2,40), new THREE.MeshStandardMaterial({color:0xD7DCE3, roughness:0.9}));
    ground.rotation.x = -Math.PI/2;
    ground.position.y = 0.001;
    ground.receiveShadow = true;
    scene.add(ground);

    const carGroup = new THREE.Group();
    carGroup.rotation.y = 0.5;
    scene.add(carGroup);

    car3D = {scene, camera, renderer, carGroup, container, bbox:null, loaded:false};

    function animate(){
      if(!car3D) return;
      car3D.raf = requestAnimationFrame(animate);
      renderer.render(scene,camera);
    }
    animate();

    // muat model asli (GLB ter-embed sebagai base64)
    const loader = new THREE.GLTFLoader();
    loader.load(
      "data:model/gltf-binary;base64," + CAR_MODEL_B64,
      function(gltf){
        const model = gltf.scene;
        model.traverse(o=>{ if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
        carGroup.add(model);
        const box = new THREE.Box3().setFromObject(model);
        car3D.bbox = box;
        car3D.loaded = true;
      },
      undefined,
      function(err){
        document.getElementById('car3dWrapOuter').classList.add('hidden');
        document.getElementById('car2dFallback').classList.remove('hidden');
      }
    );

    const dom = renderer.domElement;
    let dragging=false, lastX=0, moved=0;
    function getPoint(e){
      const rect = dom.getBoundingClientRect();
      const cx = (e.touches? e.touches[0].clientX : e.clientX);
      const cy = (e.touches? e.touches[0].clientY : e.clientY);
      return {x:cx-rect.left, y:cy-rect.top};
    }
    function pDown(e){ dragging=true; moved=0; const p=getPoint(e); lastX=p.x; }
    function pMove(e){
      if(!dragging) return;
      const p = getPoint(e);
      const dx = p.x-lastX;
      moved += Math.abs(dx);
      carGroup.rotation.y += dx*0.012;
      lastX = p.x;
    }
    function pUp(e){
      if(!dragging) return;
      dragging=false;
      if(moved < 6){
        const p = getPoint(e);
        handleTap(p.x,p.y);
      }
    }
    dom.addEventListener('mousedown',pDown);
    dom.addEventListener('mousemove',pMove);
    window.addEventListener('mouseup',pUp);
    dom.addEventListener('touchstart',pDown,{passive:true});
    dom.addEventListener('touchmove',pMove,{passive:true});
    dom.addEventListener('touchend',pUp);

    const raycaster = new THREE.Raycaster();
    function handleTap(px,py){
      if(!car3D || !car3D.loaded) return;
      const rect = dom.getBoundingClientRect();
      const ndc = new THREE.Vector2((px/rect.width)*2-1, -(py/rect.height)*2+1);
      raycaster.setFromCamera(ndc, camera);
      const intersects = raycaster.intersectObjects(carGroup.children, true);
      const hit = intersects.find(i=>i.object.isMesh);
      if(!hit) return;
      const localPt = carGroup.worldToLocal(hit.point.clone());
      const zone = classifyCarHit(localPt, car3D.bbox, carGroup);
      if(!zone) return;
      registerCarZonePick(zone, px, py);
    }
  }catch(e){
    const outer = document.getElementById('car3dWrapOuter');
    const fb = document.getElementById('car2dFallback');
    if(outer) outer.classList.add('hidden');
    if(fb) fb.classList.remove('hidden');
  }
}

function classifyCarHit(localPt, bbox, carGroup){
  if(!bbox) return null;
  // bbox dihitung di world space model sebelum rotasi carGroup diterapkan pada frame ini;
  // karena carGroup.worldToLocal sudah mengembalikan titik relatif terhadap grup (sebelum rotasi Y grup),
  // kita pakai batas box asli model (bbox) yang juga dalam ruang lokal grup (karena dihitung dari objek
  // yang sudah jadi anak carGroup sebelum ada transform tambahan lain).
  const min = bbox.min, max = bbox.max;
  const zLen = max.z - min.z;
  const zPct = ((localPt.z - min.z) / zLen) * 100;
  const xMid = (min.x + max.x) / 2;
  const side = localPt.x < xMid ? "Kiri" : "Kanan";

  let part="", position="", useSide=false;
  if(zPct<9){ part="Bumper Depan"; position="Depan"; }
  else if(zPct<21){ part="Kap Mesin"; position="Depan"; }
  else if(zPct<30){ part="Kaca Depan"; position="Depan"; }
  else if(zPct<45){ part="Pintu Depan"; position="Depan"; useSide=true; }
  else if(zPct<52){ part="Pintu Tengah"; useSide=true; }
  else if(zPct<61){ part="Pintu Belakang"; position="Belakang"; useSide=true; }
  else if(zPct<68){ part="Kaca Belakang"; position="Belakang"; }
  else if(zPct<80){ part="Backdoor"; position="Belakang"; }
  else{ part="Bumper Belakang"; position="Belakang"; }
  return {part, side: useSide?side:"", position};
}

function registerCarZonePick(zone, px, py){
  defectFormState.part = zone.part;
  defectFormState.side = zone.side||"";

    const src = car3D.renderer.domElement;
    const snap = document.createElement('canvas');
    snap.width = src.width; snap.height = src.height;
    const ctx = snap.getContext('2d');
    ctx.drawImage(src,0,0);
    const scaleX = src.width / src.clientWidth;
    const scaleY = src.height / src.clientHeight;
    ctx.beginPath();
    ctx.arc(px*scaleX, py*scaleY, 9*scaleX, 0, Math.PI*2);
    ctx.fillStyle = "#DE4B4B";
    ctx.fill();
    ctx.lineWidth = 3*scaleX;
    ctx.strokeStyle = "#fff";
    ctx.stroke();
    { const sc = Math.min(1, 480/Math.max(snap.width, snap.height)), sm = document.createElement('canvas');
      sm.width = Math.max(1,Math.round(snap.width*sc)); sm.height = Math.max(1,Math.round(snap.height*sc));
      const sx = sm.getContext('2d'); sx.fillStyle = '#eef1f6'; sx.fillRect(0,0,sm.width,sm.height); sx.drawImage(snap,0,0,sm.width,sm.height);
      defectFormState.diagramSnapshot = sm.toDataURL('image/jpeg',0.65); }
  }catch(e){ defectFormState.diagramSnapshot = null; }

  const labelEl = document.getElementById('carZoneLabel3d');
  if(labelEl){
    labelEl.style.color = 'var(--gold)';
    labelEl.textContent = `📍 ${zone.part}${zone.side?(' '+zone.side):''}${zone.position?(' '+zone.position):''}`;

  if(zone.part==="Pintu Depan" || zone.part==="Pintu Belakang" || zone.part==="Pintu Tengah"){
    openDoorDetailPicker(zone.part, zone.side, zone.position);

}

let dccpParsedPreview = null;
function dccpTimeStr(v){
  if(v==null || v==="") return null;
  if(typeof v==="number"){
    if(v<=0 || v>=1.0001) return null;
    const mins = Math.round(v*1440);
    return String(Math.floor(mins/60)%24).padStart(2,"0")+":"+String(mins%60).padStart(2,"0");
  }
  if(v instanceof Date){ return String(v.getHours()).padStart(2,"0")+":"+String(v.getMinutes()).padStart(2,"0"); }
  const m = String(v).trim().match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
  return m ? m[1].padStart(2,"0")+":"+m[2] : null;
}
function handleDccpFile(evt){
  const f = evt.target.files && evt.target.files[0];
  const msg = document.getElementById("dccpMsg");
  if(!f) return;
  if(typeof XLSX==="undefined"){ msg.innerHTML = `<div class="msg err">Library Excel belum termuat (perlu internet). Coba lagi.</div>`; return; }
  const rd = new FileReader();
  rd.onload = e=>{
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:"array"});
      const ws = wb.Sheets["DCCP"] || wb.Sheets[wb.SheetNames[0]];
      const grid = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
      const rows = parseDccpGrid(grid);
      if(!rows.length){ msg.innerHTML = `<div class="msg err">Bagian "EAST KARAWANG PLANT OPERATION" tidak ditemukan / tidak ada truk.</div>`; return; }
      dccpParsedPreview = {fileName:f.name, rows};
      render();
    }catch(err){ msg.innerHTML = `<div class="msg err">Gagal membaca file: ${err.message}</div>`; }
  };
  rd.readAsArrayBuffer(f);
}
function parseDccpGrid(grid){
  const txt = v=> v==null ? "" : String(v).trim();
  let start = -1;
  for(let r=0;r<grid.length;r++){
    if((grid[r]||[]).some(c=>/EAST\s*KARAWANG/i.test(txt(c)))){ start=r; break; }
  }
  if(start<0) return [];
  let hr=-1, cPol=-1;
  for(let r=start;r<Math.min(start+8,grid.length);r++){
    const c = (grid[r]||[]).findIndex(x=>/^police\s*no/i.test(txt(x)));
    if(c>=0){ hr=r; cPol=c; break; }
  }
  if(hr<0) return [];
  const H = grid[hr];
  const cModel = H.findIndex(x=>/cc\.?\s*model/i.test(txt(x)));
  const cDriver = H.findIndex(x=>/^driver/i.test(txt(x)));
  const cLoad = H.findIndex(x=>/^loading/i.test(txt(x)));
  const cTrip = H.findIndex(x=>/^trip$/i.test(txt(x)));
  const timeCols = [];
  for(let c=Math.max(cLoad+1,0);c<H.length;c++){ const t=dccpTimeStr(H[c]); if(t) timeCols.push({c,t}); }
  const out = []; let lp = "";
  for(let r=hr+1;r<grid.length;r++){
    const row = grid[r]||[];
    if(row.some(c=>/TOTAL\s*DELIVERY/i.test(txt(c)))) break;
    if(txt(row[1])) lp = txt(row[1]);
    const police = txt(row[cPol]);
    if(!police) continue;
    let sched="", dest=""; const trips=[];
    for(const tc of timeCols){
      const cell = row[tc.c];
      const filled = (typeof cell==="string" && cell.trim()!=="") || (typeof cell==="number" && cell>0 && !(cell<1)) ;
      if(filled){ trips.push(tc.t); if(!sched){ sched=tc.t; dest=typeof cell==="string"?cell.trim():""; } }
    }
    const nTrip = cTrip>=0 ? Number(row[cTrip]) : NaN;
    const nUnit = cLoad>=0 ? Number(row[cLoad]) : NaN;
    const planTrip = nTrip>0 ? nTrip : (trips.length||1);
    const planUnit = nUnit>0 ? nUnit : planTrip*6;
    out.push({lp, police: police.toUpperCase(), model: cModel>=0?txt(row[cModel]):"", driver: cDriver>=0?txt(row[cDriver]):"", schedTime:sched, dest, trips, planTrip, planUnit});
  }
  return out;
}
function saveDccpSchedule(){
  if(!dccpParsedPreview) return;

    d.dccpSchedule = p.rows;

function normPlat(s){ return String(s||"").replace(/\s+/g,"").toUpperCase(); }
function findActualArrival(police, data){
  const k = normPlat(police);
  for(let i=1;i<=5;i++){ const o=data.cc[i]; if(o && normPlat(o.plat)===k) return {ts:o.ts, stall:i}; }
  const q = (data.queue||[]).find(x=>normPlat(x.plat)===k);
  if(q) return {ts:q.ts, stall:null};
  return null;
}
function dccpDelayBadge(sched, arr){
  const list = Array.isArray(sched) ? sched : (sched?[sched]:[]);
  if(!list.length || !arr) return "";
  const d=new Date(arr.ts), pm=x=>(x-SHIFT_START_H*60+1440)%1440, am=pm(d.getHours()*60+d.getMinutes());
  const mins = list.map(t=>{const [h,m]=t.split(":").map(Number); return pm(h*60+m);});
  const le = mins.filter(x=>x<=am+10);
  const ref = le.length ? Math.max(...le) : mins[0];
  const diff = am-ref;
  if(diff<=5) return `<span style="color:var(--green);font-weight:700;">tepat</span>`;
  return `<span style="color:#D64545;font-weight:700;">+${diff} mnt</span>`;
}

function ccTripChipsHtml(r, data){
  const times = ((r.trips&&r.trips.length) ? r.trips : (r.schedTime?[r.schedTime]:[])).slice().sort((a,b)=>ccTimeToTs(a,0)-ccTimeToTs(b,0));
  const mid = prodMidnight(), now=Date.now();
  const k = normPlat(r.police);
  const done = (data.ils||[]).filter(b=>normPlat(b.ccPlat)===k && b.ts>=mid+SHIFT_START_H*3600000).sort((a,b)=>a.ts-b.ts);
  if(!times.length) return r.extra ? `<span style="color:var(--text-dim);font-size:12px;">spot order${done.length?` · ${done.length}x jalan`:""}</span>` : "-";
  const chips = times.map((t,i)=>{
    const due = ccTimeToTs(t, mid);
    let bg="#EEF1F6", fg="#6B7686", sub="";
    if(i<done.length){ bg="#E7F7EE"; fg="#1E9E5A"; sub=`✓ ${ldrHM(done[i].ts)}`; }
    else if(due<=now){ bg="#FDECEC"; fg="#D64545"; sub="belum"; }
    return `<span style="display:inline-block;text-align:center;background:${bg};color:${fg};border-radius:8px;padding:3px 7px;margin:2px 3px 2px 0;font-weight:700;font-size:12px;line-height:1.2;">${t}${sub?`<br><span style="font-size:10px;font-weight:600;">${sub}</span>`:""}</span>`;
  }).join("");
  return `<div style="min-width:150px;white-space:normal;">${chips}</div>`;
}

function syncUnitLog(d){
  d.unitLog = d.unitLog || [];
  const log = d.unitLog, now = Date.now();
  if(!d.migAvanzaBY){ d.migAvanzaBY = true; const a = d.models && d.models.AVANZA; if(a && Array.isArray(a.vin_codes) && !a.vin_codes.includes("BY")) a.vin_codes.push("BY"); }   // Avanza baru (W100RE) berkode BY
  { const a2 = d.models && d.models.AVANZA; if(a2 && /^#(2CA85B|1E9E5A)$/i.test(a2.color||"")) a2.color = "#8E5BD6"; }   // Avanza ungu (hijau = stall kosong)
  if(!d.unitLogMigrated){
    d.unitLogMigrated = true;
    (d.ils||[]).filter(b=>b.status==="done").forEach(b=>{
      b.units.forEach(u=>{
        log.push({frame:u.frame, model:u.model, parkedTs:null, parkedBy:"", slot:u.slot, status:"sent",
          ilsId:b.id, ilsTs:b.ts, sentTs:b.doneTs||b.ts, ccPlat:b.ccPlat, lp:b.lp});
      });
    });
  }
  const present = new Set();
  for(const [slot,u] of Object.entries(d.units||{})){
    if(!u) continue;
    let e = log.find(x=>x.parkedTs===u.ts && (x.status==="parked"||x.status==="ils"));
    if(!e){ e = {frame:u.frame, model:u.model, parkedTs:u.ts||now, parkedBy:u.driver||"", slot:slotText(slot,u), line:u.line||"", status:"parked"}; log.push(e); }
    e.frame = u.frame; e.model = u.model; e.slot = slotText(slot,u); e.line = u.line||e.line||""; e.batam = !!u.batam; e.prio = !!u.prio;
    const b = u.ilsId ? (d.ils||[]).find(x=>x.id===u.ilsId) : null;
    if(b){ e.status="ils"; e.ilsId=b.id; e.ilsTs=b.ts; e.ccPlat=b.ccPlat; e.lp=b.lp; }
    else { e.status="parked"; delete e.ilsId; delete e.ilsTs; delete e.ccPlat; delete e.lp; }
    present.add(e);
  }
  for(const e of log){
    if((e.status==="parked"||e.status==="ils") && !present.has(e)){
      const b = (d.ils||[]).find(x=>x.status==="done" && x.units.some(u=>u.frame===e.frame));
      if(b){ e.status="sent"; e.sentTs=b.doneTs||now; e.ilsId=b.id; e.ilsTs=b.ts; e.ccPlat=b.ccPlat; e.lp=b.lp; }
      else { e.status="removed"; e.removedTs=now; }
    }
  }
  /* Retensi: data unit yang sudah TERKIRIM / dikeluarkan + manifest ILS selesai disimpan 26 jam saja, lalu dihapus otomatis */
  const cut = now - RETAIN_MS;
  const clr = d.logClearTs||0;
  d.unitLog = log.filter(e=> !((e.status==="sent" && (e.sentTs||e.ilsTs||0) < cut) || (e.status==="removed" && (e.removedTs||0) < cut)))
    .filter(e=> present.has(e) || !clr || Math.max(e.parkedTs||0,e.ilsTs||0,e.sentTs||0,e.removedTs||0) > clr);
  if(clr) d.ils = (d.ils||[]).filter(b=> !(b.status==="done" && (b.doneTs||b.ts||0) <= clr));
  d.ils = (d.ils||[]).filter(b=> !(b.status==="done" && (b.doneTs||b.ts||0) < cut));
}

let ldrPeriod = "today";
let ldrSearch = "";
const LDR_SLOT_MS = 30*60*1000;
function ldrHM(ts){ return ts ? new Date(ts).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}).replace('.',':') : "-"; }
function ldrDT(ts){
  if(!ts) return "-";
  const d = new Date(ts), t = new Date();
  const same = d.toDateString()===t.toDateString();
  return same ? ldrHM(ts) : d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'})+" "+ldrHM(ts);
}
function ldrAge(ts){
  if(!ts) return "-";
  const m = Math.max(0,Math.round((Date.now()-ts)/60000));
  return m<60 ? m+" mnt" : Math.floor(m/60)+" j "+(m%60)+" m";
}
/* Hari produksi: berganti jam 07:00 (00:01 masih tanggal sebelumnya).
   Shift Day: 07:00–20:00, Shift Night: 20:00–07:00 hari berikutnya. */
const SHIFT_START_H = 7, SHIFT2_START_H = 20;
const PROD_LINES = ["KP1","KP2"];
const PARK_ORDER = ["14A","15A","16A","17A","14B","15B","16B","17B"];   // prioritas parkir: terkecil → terbesar, A dulu baru B
let vinDraft = "";
let dispLine = ""; try{ dispLine = localStorage.getItem("apcc_line")||""; }catch(e){}
function setDispLine(l){ dispLine = l; try{ localStorage.setItem("apcc_line", dispLine); }catch(e){} document.querySelectorAll(".linechip").forEach(b=>b.classList.toggle("on", b.dataset.line===dispLine)); const w=document.getElementById("lineWarn"); if(w) w.style.display="none"; }
function requireLine(){ if(dispLine) return true; const w=document.getElementById("lineWarn"); if(w){ w.style.display="block"; w.scrollIntoView({block:"center",behavior:"smooth"}); } alert("Pilih line produksi dulu (KP1 atau KP2) sebelum input unit."); return false; }
let ldrShift = "all";
function prodDayStart(ts){
  const d = new Date(ts==null?Date.now():ts);
  if(d.getHours() < SHIFT_START_H) d.setDate(d.getDate()-1);
  d.setHours(SHIFT_START_H,0,0,0);
  return d.getTime();
}
function prodMidnight(ts){ return prodDayStart(ts) - SHIFT_START_H*3600000; }   // 00:00 tanggal produksi
function shiftWindow(pd, which){
  const h = 3600000, s2 = pd + (SHIFT2_START_H-SHIFT_START_H)*h;
  if(which==="1") return [pd, s2];
  if(which==="2") return [s2, pd+24*h];
  return [pd, pd+24*h];
}
function currentShift(){ const now=Date.now(), pd=prodDayStart(now); return now < pd+(SHIFT2_START_H-SHIFT_START_H)*3600000 ? "1" : "2"; }
function shiftLabel(w){ return w==="1" ? "Shift Day (07:00–20:00)" : w==="2" ? "Shift Night (20:00–07:00)" : "Semua shift"; }
function ldrRange(){
  const pd = prodDayStart();
  if(ldrPeriod==="24h"){ const e=Date.now(); return [Math.floor((e-86400000)/LDR_SLOT_MS)*LDR_SLOT_MS, e]; }
  const base = ldrPeriod==="yesterday" ? pd-86400000 : pd;
  return shiftWindow(base, ldrShift);
}
function ldrShiftSelect(){
  return `<select onchange="ldrShift=this.value;render()" ${ldrPeriod==='24h'?'disabled':''}>
    <option value="all" ${ldrShift==='all'?'selected':''}>Semua shift</option>
    <option value="1" ${ldrShift==='1'?'selected':''}>Shift Day · 07–20</option>
    <option value="2" ${ldrShift==='2'?'selected':''}>Shift Night · 20–07</option></select>`;
}
function ldrCompute(data){
  const log = data.unitLog||[];
  const [rs, re] = ldrRange();
  const now = Date.now();
  const endLimit = Math.min(re, now);
  const nb = Math.max(1, Math.ceil((endLimit-rs)/LDR_SLOT_MS));
  const slots = [];
  for(let i=0;i<nb;i++){
    const a = rs+i*LDR_SLOT_MS, b = a+LDR_SLOT_MS;
    slots.push({a, b, label: ldrHM(a), inp:0, out:0, wip:0, byModel:{}});
  }
  const modelSet = new Set(Object.keys(data.models||{}));
  const idxOf = ts=>{ if(ts==null || ts<rs || ts>=re) return -1; const i=Math.floor((ts-rs)/LDR_SLOT_MS); return i<nb?i:-1; };
  let tIn=0, tOut=0;
  const byLine = {};
  const byModel = {};
  const mm = m=>{ modelSet.add(m); return byModel[m] = byModel[m] || {inp:0,out:0,wip:0}; };
  log.forEach(e=>{
    const m = mm(e.model);
    const i = idxOf(e.parkedTs);
    if(i>=0){ slots[i].inp++; slots[i].byModel[e.model]=(slots[i].byModel[e.model]||0)+1; tIn++; m.inp++; const ln=e.line||"-"; byLine[ln]=(byLine[ln]||0)+1; }
    const j = idxOf(e.sentTs);
    if(j>=0){ slots[j].out++; tOut++; m.out++; }
    if(e.status==="parked"||e.status==="ils") m.wip++;
  });
  slots.forEach(s=>{
    s.wip = log.filter(e=>e.parkedTs!=null && e.parkedTs<s.b && !( (e.sentTs&&e.sentTs<s.b) || (e.removedTs&&e.removedTs<s.b) )).length;
  });
  const wipList = log.filter(e=>e.status==="parked"||e.status==="ils").sort((a,b)=>(a.parkedTs||0)-(b.parkedTs||0));
  // buang slot kosong di awal (sebelum aktivitas pertama) agar tabel ringkas
  let first = slots.findIndex(s=>s.inp||s.out);
  if(first<0) first = Math.max(0, nb-4);
  return {slots: slots.slice(first), tIn, tOut, byModel, byLine, models:[...modelSet], wipList, wipTotal: wipList.length};
}
function ldrChartSVG(slots){
  const n = slots.length;
  const W = Math.max(640, n*46), H = 260, L=34, B=34, T=14, R=10;
  const pw = W-L-R, ph = H-T-B;
  const mx = Math.max(4, ...slots.map(s=>Math.max(s.inp,s.out,s.wip)));
  const y = v=> T + ph - (v/mx)*ph;
  const gw = pw/n, bw = Math.min(14, gw/3);
  let g = "";
  for(let k=0;k<=4;k++){
    const v = Math.round(mx*k/4), yy = y(v);
    g += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#E2E6ED"/><text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="10" fill="#6B7686">${v}</text>`;
  }
  let bars="", pts=[];
  slots.forEach((s,i)=>{
    const cx = L+gw*i+gw/2;
    bars += `<rect x="${cx-bw-1}" y="${y(s.inp)}" width="${bw}" height="${T+ph-y(s.inp)}" fill="#16213E" rx="2"><title>${s.label} Input: ${s.inp}</title></rect>`;
    bars += `<rect x="${cx+1}" y="${y(s.out)}" width="${bw}" height="${T+ph-y(s.out)}" fill="#1E9E5A" rx="2"><title>${s.label} Kirim: ${s.out}</title></rect>`;
    pts.push([cx, y(s.wip), s]);
    if(n<=16 || i%2===0) bars += `<text x="${cx}" y="${H-B+16}" text-anchor="middle" font-size="10" fill="#6B7686">${s.label}</text>`;
  });
  const line = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const dots = pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#E8833A"><title>${p[2].label} WIP: ${p[2].wip}</title></circle>`).join("");
  return `<div style="overflow-x:auto;"><svg viewBox="0 0 ${W} ${H}" style="min-width:${n>12?W:0}px;width:100%;height:auto;">${g}${bars}<path d="${line}" fill="none" stroke="#E8833A" stroke-width="2.5"/>${dots}</svg></div>
  <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-dim);margin-top:4px;">
    <span><i style="display:inline-block;width:10px;height:10px;background:#16213E;border-radius:2px;"></i> Input</span>
    <span><i style="display:inline-block;width:10px;height:10px;background:#1E9E5A;border-radius:2px;"></i> Terkirim</span>
    <span><i style="display:inline-block;width:14px;height:3px;background:#E8833A;"></i> WIP (akhir slot)</span></div>`;
}
function ldrStackSVG(slots, models, data){
  const n = slots.length;
  const W = Math.max(640, n*46), H = 220, L=34, B=30, T=10, R=10;
  const pw=W-L-R, ph=H-T-B, gw=pw/n, bw=Math.min(24,gw*0.6);
  const mx = Math.max(4, ...slots.map(s=>s.inp));
  const y = v=>T+ph-(v/mx)*ph;
  let out="";
  for(let k=0;k<=4;k++){ const v=Math.round(mx*k/4), yy=y(v);
    out += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#E2E6ED"/><text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="10" fill="#6B7686">${v}</text>`; }
  slots.forEach((s,i)=>{
    const cx=L+gw*i+gw/2; let acc=0;
    models.forEach(m=>{ const v=s.byModel[m]||0; if(!v) return;
      out += `<rect x="${cx-bw/2}" y="${y(acc+v)}" width="${bw}" height="${y(acc)-y(acc+v)}" fill="${getModelColor(m,data)}"><title>${s.label} ${m}: ${v}</title></rect>`; acc+=v; });
    if(n<=16 || i%2===0) out += `<text x="${cx}" y="${H-B+16}" text-anchor="middle" font-size="10" fill="#6B7686">${s.label}</text>`;
  });
  const legend = models.map(m=>`<span><i style="display:inline-block;width:10px;height:10px;background:${getModelColor(m,data)};border-radius:2px;"></i> ${m}</span>`).join("");
  return `<div style="overflow-x:auto;"><svg viewBox="0 0 ${W} ${H}" style="min-width:${n>12?W:0}px;width:100%;height:auto;">${out}</svg></div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-dim);margin-top:4px;">${legend}</div>`;
}

/* ======================================================================
   DASHBOARD PLANNING CAR CARRIER (plan DCCP vs aktual ritase)
====================================================================== */
function ccTimeToTs(hhmm, dayStart){ const [h,m]=hhmm.split(":").map(Number); return dayStart+(h*60+m)*60000+(h<SHIFT_START_H?86400000:0); }
function ccplanCompute(data){
  const [rs,re] = ldrRange(); const now = Date.now();
  const dayStart = prodMidnight() - (ldrPeriod==='yesterday'?86400000:0);
  const inShift = t=>{ if(ldrShift==='all'||ldrPeriod==='24h') return true; const h=+t.split(':')[0]; const s1 = h>=SHIFT_START_H && h<SHIFT2_START_H; return ldrShift==='1'?s1:!s1; };
  const ils = (data.ils||[]).filter(b=>b.ts>=rs && b.ts<re);
  const act = {}, actU = {};
  ils.forEach(b=>{ const k=normPlat(b.ccPlat); act[k]=(act[k]||0)+1; actU[k]=(actU[k]||0)+(b.units||[]).length; });
  const sched = data.dccpSchedule||[];
  const keys = new Set();
  const rows = sched.map(r=>{
    const k = normPlat(r.police); keys.add(k);
    const allT = (r.trips||[]).slice().sort((a,b)=>ccTimeToTs(a,0)-ccTimeToTs(b,0));
    const times = allT.filter(inShift);
    const filtered = times.length!==allT.length;
    let planTrip = r.planTrip!=null ? Number(r.planTrip) : (allT.length || 1);
    let planUnit = r.planUnit!=null ? Number(r.planUnit) : planTrip*6;
    if(filtered){ const per = planTrip? planUnit/planTrip : 6; planTrip = times.length; planUnit = Math.round(times.length*per); }
    const dueNow = ldrPeriod==="yesterday" ? planTrip : (times.length ? times.filter(t=>ccTimeToTs(t,dayStart)<=now).length : planTrip);
    const nextT = times.find(t=>ccTimeToTs(t,dayStart)>now) || "";
    const a = act[k]||0, au = actU[k]||0;
    const inYard = findActualArrival(r.police,data);
    let status = "ontrack";
    if(a>=planTrip) status="done"; else if(a<dueNow) status="late";
    return {r, planTrip, planUnit, dueNow, nextT, act:a, actUnit:au, minus:planTrip-a, dueMinus:Math.max(0,dueNow-a), inYard, status, times};
  });
  for(let i=rows.length-1;i>=0;i--){ if(ldrShift!=='all' && ldrPeriod!=='24h' && rows[i].planTrip===0 && rows[i].act===0) rows.splice(i,1); }
  const unplanned = Object.keys(act).filter(k=>!keys.has(k)).map(k=>({plat:k, act:act[k], actUnit:actU[k]}));
  const T = {planTrip:0, planUnit:0, act:0, actUnit:0, due:0};
  rows.forEach(x=>{ T.planTrip+=x.planTrip; T.planUnit+=x.planUnit; T.due+=x.dueNow; });
  T.act = ils.length; T.actUnit = ils.reduce((a,b)=>a+(b.units||[]).length,0);
  T.minus = T.planTrip - T.act; T.dueMinus = Math.max(0, T.due - T.act);
  // per LP
  const lp = {};
  rows.forEach(x=>{ const o=lp[x.r.lp]=lp[x.r.lp]||{plan:0,act:0,due:0,unit:0,actUnit:0}; o.plan+=x.planTrip; o.act+=x.act; o.due+=x.dueNow; o.unit+=x.planUnit; o.actUnit+=x.actUnit; });
  // kurva kumulatif per 30 menit
  const allTimes = []; rows.forEach(x=>x.times.forEach(t=>allTimes.push(ccTimeToTs(t,dayStart))));
  const slots = [];
  if(allTimes.length){
    const lo = Math.floor(Math.min(...allTimes)/LDR_SLOT_MS)*LDR_SLOT_MS;
    const hi = Math.ceil(Math.max(...allTimes, ldrPeriod==="yesterday"?0:Math.min(now,Math.max(...allTimes)+2*3600000))/LDR_SLOT_MS)*LDR_SLOT_MS;
    for(let a=lo;a<=hi;a+=LDR_SLOT_MS){
      slots.push({a, label:ldrHM(a), plan: allTimes.filter(t=>t<=a).length, act: a<=now ? ils.filter(b=>b.ts<=a).length : null});
    }
  }
  return {rows, unplanned, T, lp, slots};
}
function ccplanChartSVG(slots){
  const n=slots.length; if(n<2) return `<div class="emptystate">Belum ada data jam jadwal. Upload ulang file DCCP agar jam tiap ritase terbaca.</div>`;
  const W=Math.max(640,n*40), H=240, L=34, B=30, T=12, R=10, pw=W-L-R, ph=H-T-B;
  const mx=Math.max(4,...slots.map(s=>Math.max(s.plan,s.act||0)));
  const x=i=>L+pw*i/(n-1), y=v=>T+ph-(v/mx)*ph;
  let g=""; for(let k=0;k<=4;k++){ const v=Math.round(mx*k/4), yy=y(v); g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#E2E6ED"/><text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="10" fill="#6B7686">${v}</text>`; }
  const pl = slots.map((s,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(s.plan).toFixed(1)).join(" ");
  const ac = slots.map((s,i)=>s.act==null?null:[x(i),y(s.act)]).filter(Boolean);
  const al = ac.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const lbl = slots.map((s,i)=>(n<=14||i%2===0)?`<text x="${x(i)}" y="${H-B+16}" text-anchor="middle" font-size="10" fill="#6B7686">${s.label}</text>`:"").join("");
  const gap = slots.map((s,i)=>s.act!=null&&s.plan>s.act?`<line x1="${x(i)}" x2="${x(i)}" y1="${y(s.plan)}" y2="${y(s.act)}" stroke="#D64545" stroke-opacity=".35" stroke-width="3"/>`:"").join("");
  return `<div style="overflow-x:auto;"><svg viewBox="0 0 ${W} ${H}" style="min-width:${n>14?W:0}px;width:100%;height:auto;">${g}${gap}<path d="${pl}" fill="none" stroke="#16213E" stroke-width="2.5" stroke-dasharray="6 4"/><path d="${al}" fill="none" stroke="#1E9E5A" stroke-width="3"/>${ac.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#1E9E5A"/>`).join("")}${lbl}</svg></div>
  <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-dim);margin-top:4px;"><span>┅ Plan kumulatif</span><span><b style="color:#1E9E5A;">━</b> Aktual kumulatif</span><span style="color:#D64545;">┃ selisih (minus)</span></div>`;
}

   PLAN PRODUKSI (input Admin) — plan unit per model per shift
   data.prodPlan["YYYY-MM-DD"] = { s1:{MODEL:n}, s2:{MODEL:n} }  (tanggal = hari produksi)

function prodDateKey(ts){ const d=new Date(prodMidnight(ts)); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function normPlanEntry(e){
  e = e || {};
  const out = {s1:{}, s2:{}, m1:{}, m2:{}};
  ["1","2"].forEach(k=>{
    const src = e["s"+k]||{};
    Object.entries(src).forEach(([key,n])=>{ if(PROD_LINES.includes(key)) out["s"+k][key]=n; else out["m"+k][key]=n; });   // format lama (per model) ikut terbaca
    Object.entries(e["m"+k]||{}).forEach(([key,n])=>{ out["m"+k][key]=n; });
  });
  return out;
}
function getPlanFor(data, baseTs, which){   // baseTs = ts di dalam hari produksi tsb
  const e = normPlanEntry((data.prodPlan||{})[prodDateKey(baseTs)]);
  const byModel = {}, byLine = {}; let total = 0, has = false, totalModel = 0;
  ["1","2"].forEach(k=>{
    if(which==="1" && k!=="1") return; if(which==="2" && k!=="2") return;
    Object.entries(e["s"+k]).forEach(([l,n])=>{ n=Number(n)||0; if(!n) return; byLine[l]=(byLine[l]||0)+n; total+=n; has=true; });
    Object.entries(e["m"+k]).forEach(([m,n])=>{ n=Number(n)||0; if(!n) return; byModel[m]=(byModel[m]||0)+n; totalModel+=n; });
  });
  if(!total && totalModel){ total = totalModel; has = true; }   // plan lama per model saja
  return {total, byModel, byLine, has};
}
function fmtMinus(v){ return v>0 ? "−"+v : (v<0 ? "+"+(-v) : "0"); }

function qrMatrix(text){

    for(let c=0;c<N;c++){ let run=1; for(let r=1;r<N;r++){ if(Q[r][c]===Q[r-1][c]) { run++; if(run===5) p+=3; else if(run>5) p++; } else run=1; } }

  </div>`;

/* --- upload daftar --- */
function parseBatamWorkbook(wb, kind){
  kind = kind || "batam";
  const out = new Map();
  const T = v=>v==null?"":String(v).trim();
  const catOf = txt=>{ const u=txt.toUpperCase(); return {batam:/BATAM|\bBTM\b|SEKUPANG|BATU\s*AMPAR/.test(u), prio:/PRIO|URGENT|EXPRESS/.test(u)}; };
  const isHdrVin = x=>{ const t=T(x); return t.length>0 && t.length<=30 && /^(no\.?\s*)?(rangka|vin|frame\s*(no|number)?|framenumber|chassis|chasis|no\.?\s*rgk)/i.test(t.replace(/\s+/g," ")); };
  wb.SheetNames.forEach(name=>{
    const grid = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:null});
    let hr=-1, cV=-1, cK=-1, cD=-1;
    for(let r=0;r<Math.min(30,grid.length)&&hr<0;r++){
      const row = grid[r]||[];
      const c = row.findIndex(isHdrVin);
      if(c>=0){
        hr=r; cV=c;
        cK = row.findIndex(x=>{ const t=T(x); return t.length<=30 && /kategori|category|keterangan|^ket\b|status|prior|jenis/i.test(t); });
        cD = row.findIndex(x=>{ const t=T(x); return t.length<=30 && /branch|cabang|dealer|tujuan|dest|customer|kota|city/i.test(t); });
      }
    }
    for(let r=(hr>=0?hr+1:0); r<grid.length; r++){
      const row = grid[r]||[];
      let vin = "";
      if(hr>=0){ vin = normVin(row[cV]); if(vin.length<6 || !/[A-Z]/.test(vin) || !/\d/.test(vin)) continue; }
      else{
        for(const cell of row){ const m = normVin(cell).match(/^[A-HJ-NPR-Z0-9]{17}$/); if(m){ vin=m[0]; break; } }
        if(!vin) continue;
      }
      const dest = cD>=0 ? T(row[cD]) : "";
      // kategori dari kolom keterangan + kolom tujuan/dealer; kalau kosong, baca seluruh baris
      let txt = [cK>=0?T(row[cK]):"", dest].join(" ");
      let c = catOf(txt);
      if(!c.batam && !c.prio && cK<0 && cD<0) c = catOf(row.map(T).join(" "));
      if(kind==="prio") c = {batam:false, prio:true};            // semua unit di file prioritas = prioritas
      else c = {batam:c.batam, prio:false};                      // file Batam hanya menentukan Batam
      const prev = out.get(vin);
      out.set(vin, {vin, batam:c.batam||(prev&&prev.batam)||false, prio:c.prio||(prev&&prev.prio)||false, explicit: c.batam||c.prio||(prev&&prev.explicit)||false, dest: dest||(prev&&prev.dest)||""});
    }
  });
  return [...out.values()];
}
let catPreviews = {batam:null, prio:null};
function handleCatFile(evt, kind){
  const f = evt.target.files && evt.target.files[0];
  const msg = document.getElementById("catMsg_"+kind);
  if(!f) return;
  if(typeof XLSX==="undefined"){ msg.innerHTML = `<div class="msg err">Library Excel belum termuat (perlu internet). Coba lagi.</div>`; return; }
  const rd = new FileReader();
  rd.onload = e=>{
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:"array"});
      const rows = parseBatamWorkbook(wb, kind);
      if(!rows.length){ msg.innerHTML = `<div class="msg err">Tidak ada No. Rangka yang terbaca. Pastikan ada kolom "No. Rangka"/"FrameNumber"/"VIN" atau No. Rangka 17 karakter.</div>`; return; }
      catPreviews[kind] = {fileName:f.name, rows};
      if(kind==="batam") batamDefaultCat = /batam|btm/i.test(f.name) ? "batam" : batamDefaultCat;
      render();
    }catch(err){ msg.innerHTML = `<div class="msg err">Gagal membaca file: ${err.message}</div>`; }
  };
  rd.readAsArrayBuffer(f);
}
function cancelCatPreview(kind){ catPreviews[kind]=null; render(); }
function saveCatList(kind){
  const p = catPreviews[kind]; if(!p) return;
  const def = batamDefaultCat;
  DB.set(d=>{
    d.unitCat = d.unitCat || {};
    p.rows.forEach(r=>{
      const old = d.unitCat[r.vin] || {};
      const e = {...old, src:"upload", file:p.fileName, by:(currentUser&&currentUser.name)||"", ts:Date.now()};
      if(kind==="batam"){
        const isB = r.explicit ? r.batam : (def==="batam");
        if(isB){ e.batam = true; if(r.dest) e.dest = r.dest; }
      }else{
        e.prio = true;
      }
      e.batam = !!e.batam; e.prio = !!e.prio;
      if(e.batam || e.prio) d.unitCat[r.vin] = e;
    });
    // unit yang SUDAH terparkir ikut diperbarui statusnya
    Object.values(d.units).forEach(u=>{ if(!u) return; const c=lookupUnitCat(d,u.frame); if(c){ if(kind==="batam") u.batam=!!c.batam; else u.prio=!!c.prio; } });
  });
  catPreviews[kind] = null; render();
}
function clearCatList(kind){
  const nm = kind==="batam" ? "Batam" : "Prioritas";
  if(!confirm(`Hapus seluruh daftar unit ${nm}? Unit yang sudah terparkir tidak berubah.`)) return;
  DB.set(d=>{
    const m = d.unitCat||{};
    Object.keys(m).forEach(k=>{ m[k][kind]=false; if(!m[k].batam && !m[k].prio) delete m[k]; });
  });
}
function toggleBatamStall(g, on){
  DB.set(d=>{ const s=new Set(d.batamStalls||[]); if(on) s.add(g); else s.delete(g); d.batamStalls = PARK_ORDER.filter(x=>s.has(x)); });

}

function haversineKm(lat1,lng1,lat2,lng2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLng = (lng2-lng1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function useCurrentLocForYard(){
  const msgEl = document.getElementById("yardLocMsg");
  msgEl.innerHTML = `<div class="msg info">📍 Mengambil lokasi...</div>`;
  if(!navigator.geolocation){ msgEl.innerHTML = `<div class="msg err">Browser tidak mendukung GPS.</div>`; return; }
  navigator.geolocation.getCurrentPosition(
    pos=>{
      document.getElementById("yardLat").value = pos.coords.latitude.toFixed(6);
      document.getElementById("yardLng").value = pos.coords.longitude.toFixed(6);
      msgEl.innerHTML = `<div class="msg ok">✔ Lokasi terisi. Klik "Simpan Lokasi Yard" buat konfirmasi.</div>`;
    },
    err=>{ msgEl.innerHTML = `<div class="msg err">Gagal ambil lokasi: ${err.message}. Pastikan izin GPS diaktifkan.</div>`; },
    {enableHighAccuracy:true, timeout:10000}
  );
}

function bulkRoleChange(){

function genPass(){
  const c = "abcdefghjkmnpqrstuvwxyz23456789", a = new Uint32Array(6); crypto.getRandomValues(a);
  let s = ""; a.forEach(x=>{ s += c[x % c.length]; }); return s;
}
function bulkAddUsers(){
  const role = document.getElementById("bkRole").value;
  const n = parseInt(document.getElementById("bkCount").value, 10);
  const pref = document.getElementById("bkPrefix").value.trim().toLowerCase().replace(/[^a-z0-9._-]/g,"");
  const nameP = document.getElementById("bkName").value.trim();
  const mode = document.getElementById("bkMode").value, fixed = document.getElementById("bkPass").value.trim();
  if(!(n>=1 && n<=100)){ alert("Jumlah akun harus 1 sampai 100."); return; }
  if(!pref || !nameP){ alert("Awalan username dan awalan nama wajib diisi."); return; }
  if(mode==="same" && !fixed){ alert("Isi password, atau pilih 'Acak berbeda tiap akun'."); return; }
  const exist = new Set(DB.get().users.map(u=>u.username));
  const made = [], skipped = [];
  for(let i=1;i<=n;i++){
    const uname = pref + String(i).padStart(2,"0");
    if(exist.has(uname)){ skipped.push(uname); continue; }
    made.push({username:uname, name:nameP+" "+String(i).padStart(2,"0"), password: mode==="same"?fixed:genPass(), role});
  }
  if(!made.length){ alert("Semua username itu sudah ada. Ganti awalan username."); return; }
  bulkResult = {made, skipped};
  DB.set(d=>{ const have = new Set(d.users.map(u=>u.username)); made.forEach(u=>{ if(!have.has(u.username)) d.users.push({username:u.username, name:u.name, password:u.password, role:u.role}); }); });
}
function bulkCsv(){
  return "role,username,password,nama\n" + bulkResult.made.map(u=>[u.role,u.username,u.password,'"'+u.name.replace(/"/g,'""')+'"'].join(",")).join("\n");
}
function bulkDownload(){
  if(!bulkResult) return;
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([bulkCsv()], {type:"text/csv"})); a.download = "akun-radar.csv"; a.click();
}
function bulkCopy(){
  if(!bulkResult) return;
  const t = bulkCsv();
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>alert("Daftar akun disalin.")).catch(()=>alert("Gagal menyalin, gunakan Unduh CSV."));
  else alert("Salin tidak didukung, gunakan Unduh CSV.");
}

  }
  showModal(`<h3>📍 Detail Slot ${id}</h3>${body}`);
}

/* ======================================================================
   6) DISPLAY VIEW (publik, refresh otomatis)
====================================================================== */
function ccBayRowHtml(data){
  let html = "";
  for(let i=1;i<=CONFIG.CC_TOTAL;i++){
    const isEmergency = CONFIG.CC_EMERGENCY.includes(i);
    const isOpen = !isEmergency || data.ccOpen[i];
    const occ = data.cc[i];
    if(!isOpen){
      html += `<div class="ccbay closed" onclick="openCCDetail(${i})"><div class="num">STALL ${i}</div><div class="status" style="color:var(--text-dim);">TUTUP</div></div>`;
    }else if(occ){
      html += `<div class="ccbay filled" onclick="openCCDetail(${i})"><div class="num">STALL ${i}</div><div class="status">TERISI</div><div class="plat">${occ.plat}</div><div class="lp">${occ.lp||''}</div></div>`;
    }else{
      html += `<div class="ccbay empty" onclick="openCCDetail(${i})"><div class="num">STALL ${i}</div><div class="status">KOSONG</div></div>`;
    }
  }
  return html;
}

function openCCDetail(num){
  const data = DB.get();
  const occ = data.cc[num];
  const isEmergency = CONFIG.CC_EMERGENCY.includes(num);
  const isOpen = !isEmergency || data.ccOpen[num];
  let body;
  if(!isOpen){
    body = `<div class="emptystate">Stall CC ${num} sedang ditutup (slot cadangan/darurat).</div>`;
  }else if(occ){
    body = `
      <div class="field"><label>Nomor Polisi</label><div class="mono" style="font-size:15px; font-weight:700;">${occ.plat}</div></div>
      <div class="field"><label>LP / Perusahaan</label><div style="font-size:15px; font-weight:700; color:var(--gold);">${occ.lp||'-'}</div></div>
      <div class="field"><label>Waktu Masuk</label><div>${new Date(occ.ts).toLocaleString('id-ID')}</div></div>
    `;
  }else{
    body = `<div class="emptystate">Stall CC ${num} kosong, tersedia untuk truk berikutnya.</div>`;
  }
  showModal(`<h3>🚚 Detail Stall CC ${num}</h3>${body}`);
}

function renderDisplay(){
  const data = DB.get();
  const totalSlots = CONFIG.STALL_GROUPS.length*CONFIG.SLOTS_PER_STALL;
  const filledCount = Object.entries(data.units).filter(([k,u])=>u && !isOffKey(k)).length;
  const stallNums = [...new Set(CONFIG.STALL_GROUPS.map(g=>g.slice(0,-1)))];

  function stallColHtml(num, side){
    const groupId = num+side;
    let cells = "";
    for(let i=1;i<=CONFIG.SLOTS_PER_STALL;i++){
      const id = groupId+i;
      const v = data.units[id];
      const mc = v ? getModelColor(v.model, data) : null;
      cells += `<div class="yardcell ${v?'filled':'empty'}" ${v?`style="background:${mc}20; border-color:${mc}; border-style:solid;"`:''} onclick="openSlotDetail('${id}')">
        <div class="id">${id}</div>
        <div class="v" ${v?`style="color:${mc};"`:''}>${v ? v.model : 'KOSONG'}${v&&v.prio?' ⭐':''}${v&&v.batam?' <span style="background:#E8833A;color:#fff;border-radius:3px;padding:0 3px;font-size:9px;">B</span>':''}</div>
      </div>`;
    }
    const occ = [1,2,3,4,5,6].filter(i=>data.units[groupId+i]).length;
    return `<div class="stallcol">
      <div class="colhead">${groupId}${isBatamStall(data,groupId)?' <span style="background:#E8833A;color:#fff;border-radius:3px;padding:0 4px;font-size:9px;">BATAM</span>':""}<span class="n">${occ}/6</span></div>
      <div class="cellstack">${cells}</div>
    </div>`;
  }

  const colsA = stallNums.map(n=>stallColHtml(n,"A")).join("");
  const colsB = stallNums.map(n=>stallColHtml(n,"B")).join("");

  const ritaseByPlat = {};
  const _sh = currentShift(), _w = shiftWindow(prodDayStart(), _sh);
  const _ilsShift = data.ils.filter(b=>b.ts>=_w[0] && b.ts<_w[1]);
  _ilsShift.forEach(b=>{ const k=b.ccPlat; ritaseByPlat[k]=(ritaseByPlat[k]||0)+1; });
  const totalRitase = _ilsShift.length;
  const _inpByModel = {}, _inpByLine = {}; let _inpTot = 0;
  (data.unitLog||[]).forEach(e=>{ if(e.parkedTs!=null && e.parkedTs>=_w[0] && e.parkedTs<_w[1]){ _inpTot++; _inpByModel[e.model]=(_inpByModel[e.model]||0)+1; if(e.line) _inpByLine[e.line]=(_inpByLine[e.line]||0)+1; } });
  const _plan = getPlanFor(data, _w[0]+1000, _sh);
  const _pMinus = _plan.total - _inpTot;
  const planDisplayHtml = _plan.has ? `
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
          <div style="display:flex;gap:12px;flex-wrap:wrap;">
            <div style="flex:1;min-width:110px;"><div style="font-size:12px;color:var(--text-dim);">PLAN PRODUKSI</div><div style="font-size:26px;font-weight:800;">${_plan.total}</div></div>
            <div style="flex:1;min-width:110px;"><div style="font-size:12px;color:var(--text-dim);">UNIT DIINPUT</div><div style="font-size:26px;font-weight:800;color:var(--green);">${_inpTot}</div></div>
            <div style="flex:1;min-width:110px;"><div style="font-size:12px;color:var(--text-dim);">${_pMinus>0?"MASIH MINUS":"LEBIH PLAN"}</div><div style="font-size:26px;font-weight:800;color:${_pMinus>0?"#D64545":"var(--green)"};">${fmtMinus(_pMinus)}</div></div>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">${Object.keys(_plan.byLine).map(l=>{ const mi=_plan.byLine[l]-(_inpByLine[l]||0); return `<span style="border:1px solid #16213E;color:#16213E;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;">${l} ${_inpByLine[l]||0}/${_plan.byLine[l]}${mi>0?` · −${mi}`:" ✓"}</span>`; }).join("")}${Object.keys(_plan.byModel).map(m=>{ const mi=_plan.byModel[m]-(_inpByModel[m]||0); return `<span style="border:1px solid ${getModelColor(m,data)};color:${getModelColor(m,data)};border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;">${m} ${_inpByModel[m]||0}/${_plan.byModel[m]}${mi>0?` · −${mi}`:" ✓"}</span>`; }).join("")}</div>
        </div>` : "";
  const sched = data.dccpSchedule||[];
  const schedHtml = sched.length ? `
      <div class="card y-sched">
        <div class="stalltitle"><h3>📋 Jadwal CC Hari Ini (East Karawang)</h3><span class="cnt">${sched.length} truk</span></div>
        <div style="overflow-x:auto;"><table>
          <tr><th>Plat</th><th>LP / Driver</th><th>Jam Ritase</th><th>Aktual Datang</th><th>Status</th></tr>
          ${sched.map(r=>{ const a=findActualArrival(r.police,data);
            return `<tr><td><b>${r.police}</b>${r.extra?` <span style="background:#E60012;color:#fff;border-radius:4px;padding:1px 5px;font-size:10px;">SPOT</span>`:""}${r.origPolice?`<div style="font-size:10px;color:var(--text-dim);">ganti ${r.origPolice}</div>`:""}</td><td>${r.lp}<div style="font-size:11px;color:var(--text-dim);">${r.driver||""}</div></td><td>${ccTripChipsHtml(r,data)}</td>
            <td>${a?new Date(a.ts).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):"-"}</td>
            <td>${a?(a.stall?`Stall ${a.stall} `:"Antri ")+dccpDelayBadge(r.trips&&r.trips.length?r.trips:r.schedTime,a):"<span style='color:var(--text-dim)'>belum datang</span>"}</td></tr>`;}).join("")}
        </table></div>
      </div>` : "";
  return `
    <div class="yardwrap">
      ${batamAlertHtml(data)}
      <div class="ydesk"><div class="yleft">
      <div class="card y-sum">
        <div class="stalltitle"><h3>📊 Ringkasan ${shiftLabel(_sh)}</h3></div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <div style="flex:1;min-width:140px;"><div style="font-size:12px;color:var(--text-dim);">TOTAL UNIT TERPARKIR</div><div style="font-size:30px;font-weight:800;">${filledCount}<span style="font-size:16px;color:var(--text-dim);">/${totalSlots}</span></div></div>
          <div style="flex:1;min-width:140px;"><div style="font-size:12px;color:var(--text-dim);">TOTAL RITASE CC (shift ini)</div><div style="font-size:30px;font-weight:800;">${totalRitase}</div></div>
        </div>
        ${planDisplayHtml}
        ${Object.keys(ritaseByPlat).length?`<table style="margin-top:10px;"><tr><th>Plat CC</th><th>Ritase</th></tr>${Object.entries(ritaseByPlat).map(([k,v])=>`<tr><td>${k}</td><td><b>${v}</b></td></tr>`).join("")}</table>`:""}
      </div>
      <div class="card y-cc">
        <div class="stalltitle"><h3>🚚 Stall Car Carrier</h3><span class="cnt" id="dispClock"></span></div>
        <div class="ccbayrow">${ccBayRowHtml(data)}</div>
        <div class="ccentrylbl">↑ ARAH MASUK AREA ↑</div>
      </div>

      ${offUnitEntries(data).length?`<div class="y-off">${offListHtml(data,false)}</div>`:""}
      <div class="card y-queue">
        <h3>⏳ Antrian CC Menunggu (${data.queue.length})</h3>
        ${data.queue.length===0 ? `<div class="emptystate">Tidak ada antrian.</div>` :
        data.queue.map((q,i)=>`
          <div style="padding:10px 0; border-bottom:1px solid var(--border);">
            <b>#${i+1} · ${q.plat}</b> <span style="font-size:11px; color:var(--text-dim);">· ${new Date(q.ts).toLocaleTimeString('id-ID')}</span>
            ${q.absenDistKm!=null ? `<div style="font-size:11px; color:var(--green); margin-top:4px;">📍 Absen ${q.absenDistKm.toFixed(1)} km dari yard</div>` : (q.manual ? `<div style="font-size:11px; color:var(--gold); margin-top:4px;">✍ Absen manual</div>` : "")}
          </div>
        `).join("")}
      </div>
      </div>
      <div class="ymap">
      <div class="stallblock">
        <div class="stalltitle"><h3>🅿️ Peta Stall Unit</h3><span class="cnt">${filledCount}/${totalSlots} terisi</span></div>
        <div class="stallmap">
          <div class="mapcol">
            <div class="gridblock front">
              <div class="glabel">● DEPAN (A)</div>
              <div class="stallcolset">${colsA}</div>
            </div>
            <div class="gridblock back">
              <div class="glabel">● BELAKANG (B)</div>
              <div class="stallcolset">${colsB}</div>
            </div>
          </div>
          <div class="laneV">
            <span class="arw">↑</span>
            <span class="turn">↩ JALUR MASUK</span>
            <span class="arw">↑</span>
          </div>
        </div>
      </div>

      </div></div>
      ${schedHtml}
      <div class="footnote">Update otomatis tiap 3 detik</div>
    </div>
  `;
}

  const c = document.getElementById("dispClock"); if(c) c.textContent = new Date().toLocaleTimeString('id-ID');

setInterval(()=>{
  if(document.getElementById("mainView") && !document.getElementById("mainView").classList.contains("hidden")){
    if(scanStream) return; // jangan ganggu kamera yang lagi aktif scan
    const active = document.activeElement;
    const typingNow = active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.tagName === "SELECT");
    if(typingNow || activeTab==="defect" || dccpEditIdx!==null) return;
    // hanya gambar ulang kalau DATA berubah (atau tiap menit untuk umur/jam jadwal)
    let raw = null; try{ raw = localStorage.getItem(LS_KEY); }catch(e){}
    const minute = Math.floor(Date.now()/60000);
    if(raw !== _lastRaw || minute !== _lastMinute){ _lastRaw = raw; _lastMinute = minute; _autoRender = true; try{ render(); } finally { _autoRender = false; } }
  }
}, 3000);
