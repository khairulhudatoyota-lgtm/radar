<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0F2A4A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RADAR">
<meta name="description" content="RADAR — Real-time Arrival, Dispatch & Release. Manajemen stall unit & car carrier.">
<title>RADAR</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
<style>
:root{
  --bg:#EEF1F6;
  --panel:#FFFFFF;
  --panel2:#F5F7FA;
  --panel3:#F3F5F9;
  --border:#E2E6ED;
  --gold:#16213E;
  --gold-dim:#C7CEDA;
  --text:#151C2C;
  --text-dim:#6B7686;
  --green:#1E9E5A;
  --green-bg:#E7F7EE;
  --red:#D8434B;
  --red-bg:#FCEBEC;
  --blue:#2F6FE0;
  --amber-bg:#FFF6E0;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  -webkit-tap-highlight-color:transparent;
  min-height:100vh;
}
.mono{font-family:'Space Mono',monospace;}
h1,h2,h3,.disp{font-family:'Barlow Condensed',sans-serif; letter-spacing:0.02em;}
button{font-family:inherit; cursor:pointer; border:none;}
input,select{font-family:inherit;}

/* ===== Layout shell ===== */
#app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); position:relative;}
@media(min-width:900px){
  #app{max-width:1180px; box-shadow:0 0 40px rgba(0,0,0,0.08);}
  .stallcolset{gap:10px;}
  .ccbayrow{flex-wrap:wrap;}
  .dispgrid{grid-template-columns:repeat(10,1fr) !important;}
  .view{padding:22px 28px;}
  .card{padding:20px 22px;}
}
@media(min-width:1300px){
  #app{max-width:1440px;}
}
#app.wide{max-width:900px;}
.topbar{
  background:var(--panel);
  border-bottom:1px solid var(--border);
  padding:14px 16px 10px;
  position:sticky; top:0; z-index:50;
  box-shadow:0 1px 4px rgba(20,30,50,0.05);
}
.topbar .brand{display:flex; align-items:center; gap:8px;}
.topbar .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--green); box-shadow:0 0 8px var(--green);}
.topbar h1{font-size:20px; font-weight:700; color:var(--gold); text-transform:uppercase;}
.topbar .sub{font-size:11px; color:var(--text-dim); margin-top:2px;}
.userchip{display:flex; align-items:center; justify-content:space-between; margin-top:10px;}
.userchip .who{font-size:12px; color:var(--text-dim);}
.userchip .who b{color:var(--text);}
.logoutBtn{background:var(--panel2); color:var(--red); border:1px solid var(--border); padding:6px 12px; border-radius:8px; font-size:11px; font-weight:600;}

.tabbar{display:flex; overflow-x:auto; gap:6px; padding:8px 10px; background:var(--panel); border-bottom:1px solid var(--border); scrollbar-width:none;}
.tabbar::-webkit-scrollbar{display:none;}
.tabbtn{flex:none; padding:9px 14px; border-radius:9px; background:var(--panel2); color:var(--text-dim); font-size:13px; font-weight:600; white-space:nowrap; border:1px solid transparent;}
.tabbtn.active{background:var(--gold); color:#fff; border-color:var(--gold);}

.view{padding:16px; padding-bottom:40px; flex:1;}
.hidden{display:none !important;}

/* ===== Cards ===== */
.card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 1px 4px rgba(20,30,50,0.05);}
.card h3{font-size:15px; color:var(--gold); margin-bottom:10px; text-transform:uppercase; letter-spacing:0.03em;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:11px; color:var(--text-dim); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.04em;}
.field input, .field select{
  width:100%; padding:12px 12px; background:var(--panel3); border:1.5px solid var(--border);
  border-radius:9px; color:var(--text); font-size:15px;
}
.field input:focus, .field select:focus{outline:none; border-color:var(--gold);}
.btn{
  width:100%; padding:14px; border-radius:10px; font-size:14px; font-weight:700;
  text-transform:uppercase; letter-spacing:0.03em; text-align:center;
}
.btn-primary{background:var(--gold); color:#fff;}
.btn-primary:active{transform:scale(0.98);}
.btn-outline{background:transparent; border:1.5px solid var(--border); color:var(--text);}
.btn-danger{background:var(--red-bg); color:var(--red); border:1.5px solid #5A2020;}
.btn-green{background:var(--green-bg); color:var(--green); border:1.5px solid #1E5C36;}
.btn-sm{padding:9px 12px; font-size:12px; width:auto;}
.btn:disabled{opacity:0.4;}

.msg{padding:10px 12px; border-radius:9px; font-size:13px; margin-bottom:12px;}
.msg.ok{background:var(--green-bg); color:var(--green); border:1px solid #1E5C36;}
.msg.err{background:var(--red-bg); color:var(--red); border:1px solid #5A2020;}
.msg.info{background:var(--amber-bg); color:var(--gold); border:1px solid var(--gold-dim);}

/* ===== Grid slot ===== */
.stallgroup{margin-bottom:16px;}
.stallgroup .lbl{font-size:12px; color:var(--text-dim); font-weight:700; margin-bottom:6px; text-transform:uppercase;}
.slotgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.slot{
  border-radius:10px; padding:10px 6px; text-align:center; border:1.5px solid var(--border);
  background:var(--green-bg); cursor:pointer; min-height:64px; display:flex; flex-direction:column; justify-content:center;
}
.slot.filled{background:var(--red-bg); border-color:#5A2020;}
.slot.picked{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) inset;}
.slot .id{font-size:11px; color:var(--text-dim); font-weight:700;}
.slot .val{font-size:12px; font-weight:700; margin-top:3px; word-break:break-all;}
.slot.filled .val{color:var(--red);}
.slot:not(.filled) .val{color:var(--green);}

/* ===== CC cards ===== */
.ccrow{display:flex; gap:10px; overflow-x:auto; padding-bottom:6px;}
.cccard{
  flex:none; width:150px; border-radius:14px; padding:14px; text-align:center; border:1.5px solid var(--border);
}
.cccard.empty{background:var(--green-bg); border-color:#1E5C36;}
.cccard.filled{background:var(--red-bg); border-color:#5A2020;}
.cccard.closed{background:var(--panel2); opacity:0.5;}
.cccard .num{font-size:13px; font-weight:700; color:var(--text-dim);}
.cccard .status{font-size:16px; font-weight:800; margin:8px 0 4px;}
.cccard.empty .status{color:var(--green);}
.cccard.filled .status{color:var(--red);}
.cccard .plat{font-size:13px; font-weight:700; margin-top:4px;}
.cccard .lp{font-size:10px; color:var(--text-dim); margin-top:2px;}

.badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:10px; font-weight:700; text-transform:uppercase;}
.badge.gold{background:var(--amber-bg); color:var(--gold);}
.badge.green{background:var(--green-bg); color:var(--green);}
.badge.red{background:var(--red-bg); color:var(--red);}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; padding:8px 6px; color:var(--text-dim); font-size:10px; text-transform:uppercase; border-bottom:1px solid var(--border);}
td{padding:9px 6px; border-bottom:1px solid var(--border);}
.emptystate{text-align:center; padding:30px 10px; color:var(--text-dim); font-size:13px;}

.unitrow{display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border:1.5px solid var(--border); border-radius:10px; margin-bottom:8px; background:var(--panel2);}
.unitrow.checked{border-color:var(--gold); background:var(--amber-bg);}
.unitrow .info b{font-size:14px; display:block;}
.unitrow .info span{font-size:11px; color:var(--text-dim);}
.chk{width:22px; height:22px; border-radius:6px; border:2px solid var(--border); flex:none;}
.unitrow.checked .chk{background:var(--gold); border-color:var(--gold);}

.scanbox{position:relative; border-radius:14px; overflow:hidden; border:2px solid var(--gold-dim); margin-bottom:12px; background:#000;}
.scanbox video{width:100%; display:block;}
.scanbox .frame{position:absolute; inset:20%; border:3px solid var(--gold); border-radius:12px; box-shadow:0 0 0 999px rgba(0,0,0,0.35);}

/* ===== Login ===== */
.loginwrap{flex:1; display:flex; flex-direction:column; justify-content:center; padding:24px;}
.loginwrap .logo{text-align:left; margin-bottom:20px;}
.loginwrap .logo .icon{font-size:34px;}
.loginwrap .logo h1{font-size:28px; color:var(--gold); margin-top:8px; font-weight:800;}
.loginwrap .logo p{font-size:13px; color:var(--text-dim); margin-top:4px;}
.rolesectitle{font-size:12px; font-weight:800; color:var(--text-dim); letter-spacing:0.08em; margin-bottom:10px; text-transform:uppercase;}
.rolegrid{display:flex; flex-direction:column; gap:10px; margin-bottom:18px;}
.rolebtn{
  display:flex; align-items:center; gap:14px; padding:16px; border-radius:16px;
  background:var(--panel); border:1.5px solid var(--border); text-align:left;
  box-shadow:0 1px 4px rgba(20,30,50,0.05);
}
.rolebtn .ic{
  font-size:22px; flex:none; width:48px; height:48px; border-radius:12px;
  background:var(--panel2); display:flex; align-items:center; justify-content:center;
  border:1px solid var(--border);
}
.rolebtn .rtext{display:flex; flex-direction:column;}
.rolebtn .rtext b{font-size:15px; font-weight:800; color:var(--text);}
.rolebtn .rtext span{font-size:12px; color:var(--text-dim); margin-top:2px; font-weight:500;}
.rolebtn.active{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) inset;}
.rolebtn.active .ic{background:var(--gold); color:#fff;}

/* ===== Display mode ===== */
.dispgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
@media(min-width:700px){.dispgrid{grid-template-columns:repeat(8,1fr);}}
.dispcell{border-radius:10px; padding:8px 4px; text-align:center; border:1.5px solid var(--border); min-height:70px;}
.dispcell.filled{background:var(--red-bg); border-color:#5A2020;}
.dispcell.empty{background:var(--green-bg); border-color:#1E5C36;}
.dispcell .id{font-size:10px; color:var(--text-dim); font-weight:700;}
.dispcell .v{font-size:10px; font-weight:700; margin-top:4px; word-break:break-all;}

.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,0.65); display:flex; align-items:flex-end; justify-content:center; z-index:200;}
.modal{background:var(--panel); border-radius:18px 18px 0 0; padding:20px; width:100%; max-width:520px; max-height:85vh; overflow-y:auto; border-top:2px solid var(--gold-dim);}
.modal h3{color:var(--gold); margin-bottom:14px;}
.close-x{position:absolute; top:14px; right:16px; font-size:20px; color:var(--text-dim); background:none;}

.printsheet{background:#fff; color:#111; padding:16px; border-radius:8px; font-size:13px;}
.printsheet h2{color:#111; font-size:16px; margin-bottom:8px;}
.printsheet table td, .printsheet table th{border:1px solid #ccc; color:#111;}

.toggle{display:flex; align-items:center; gap:8px;}
.switch{width:42px; height:24px; border-radius:14px; background:var(--border); position:relative; flex:none;}
.switch.on{background:var(--green);}
.switch .dot{width:18px; height:18px; border-radius:50%; background:#fff; position:absolute; top:3px; left:3px; transition:0.2s;}
.switch.on .dot{left:21px;}

.footnote{font-size:11px; color:var(--text-dim); text-align:center; padding:16px;}
.active-door{background:var(--gold) !important; color:#fff !important; border-color:var(--gold) !important;}

/* ===== Display: yard map layout ===== */
.yardwrap{
  background:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size:16px 16px;
}
.stallblock{
  background:var(--panel); border:1px solid var(--border); border-radius:16px;
  padding:14px; margin-bottom:16px;
}
.stallblock .stalltitle{
  display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;
}
.stallblock .stalltitle h3{font-size:18px; color:var(--gold); letter-spacing:0.04em;}
.stallblock .stalltitle .cnt{font-size:11px; color:var(--text-dim); font-family:'Space Mono',monospace;}
.rowlabel{
  display:flex; align-items:center; gap:8px; margin-bottom:7px;
}
.rowlabel .tag{font-size:10px; font-weight:800; letter-spacing:0.08em; color:var(--text-dim);}
.rowlabel .tag.front{color:var(--gold);}
.yardrow{display:grid; grid-template-columns:repeat(6,1fr); gap:5px;}
.yardcell{
  border-radius:8px; padding:7px 3px; text-align:center; border:1.5px dashed var(--border);
  min-height:52px; display:flex; flex-direction:column; justify-content:center; cursor:pointer;
}
.yardcell.filled{background:var(--red-bg); border-color:#7a3030; border-style:solid;}
.yardcell.empty{background:var(--green-bg); border-color:#2a6b45;}
.yardcell .id{font-size:9px; color:var(--text-dim); font-weight:700; font-family:'Space Mono',monospace;}
.yardcell .v{font-size:10px; font-weight:800; margin-top:3px; word-break:break-word; line-height:1.15;}
.yardcell.filled .v{color:var(--red);}
.yardcell.empty .v{color:var(--green);}
.lane{
  position:relative; height:26px; margin:8px 0;
  background:repeating-linear-gradient(90deg, var(--gold-dim) 0 14px, transparent 14px 26px);
  background-position:center; background-size:26px 2px; background-repeat:repeat-x;
  opacity:0.55;
}
.lane::before, .lane::after{
  content:""; position:absolute; top:0; bottom:0; width:1px; background:var(--border);
}
.lane::before{left:0;} .lane::after{right:0;}
.lane .lanelabel{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  background:var(--panel); padding:1px 10px; font-size:9px; color:var(--text-dim);
  font-weight:700; letter-spacing:0.08em; border-radius:20px; border:1px solid var(--border);
}
.ccstrip{margin-bottom:18px;}
.ccstrip .stalltitle{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.ccstrip .stalltitle h3{font-size:16px; color:var(--gold);}
@media(min-width:640px){
  .yardrow{gap:8px;}
  .yardcell{min-height:64px; padding:10px 4px;}
  .yardcell .v{font-size:12px;}
}

/* ===== Display v2: peta/denah style ===== */
.ccbayrow{display:flex; border:1.5px solid var(--gold-dim); border-radius:12px; overflow:hidden;}
.ccbay{flex:1; padding:16px 6px; text-align:center; border-right:1.5px solid var(--border); position:relative; cursor:pointer;}
.ccbay:last-child{border-right:none;}
.ccbay.empty{background:var(--green-bg);}
.ccbay.filled{background:var(--red-bg);}
.ccbay.closed{background:var(--panel2); opacity:0.45;}
.ccbay .num{font-size:11px; color:var(--text-dim); font-weight:800;}
.ccbay .status{font-size:13px; font-weight:800; margin-top:6px;}
.ccbay.empty .status{color:var(--green);}
.ccbay.filled .status{color:var(--red);}
.ccbay .plat{font-size:11px; font-weight:700; margin-top:4px;}
.ccbay .lp{font-size:9px; color:var(--text-dim);}
.ccentrylbl{text-align:center; font-size:10px; color:var(--text-dim); letter-spacing:0.1em; margin-top:6px; font-weight:700;}

.stallmap{display:flex; gap:8px; align-items:stretch;}
.mapcol{flex:1; display:flex; flex-direction:column; gap:8px;}
.gridblock{border:1.5px dashed var(--border); border-radius:12px; padding:8px;}
.gridblock .glabel{font-size:10px; font-weight:800; color:var(--gold); letter-spacing:0.06em; margin-bottom:6px;}
.gridblock.back .glabel{color:var(--text-dim);}
.gridcells2{display:grid; grid-template-columns:repeat(2,1fr); gap:6px;}
.gridcells2 .yardcell{min-height:48px;}

.laneV{width:38px; flex:none; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:6px 0;}
.laneV::before{content:""; position:absolute; left:50%; top:0; bottom:0; width:2px; transform:translateX(-50%);
  background:repeating-linear-gradient(180deg, var(--gold-dim) 0 8px, transparent 8px 16px);}
.laneV .arw{font-size:15px; color:var(--gold); z-index:1; background:var(--stallblock-bg, var(--panel)); line-height:1;}
.laneV .turn{font-size:10px; color:var(--gold); background:var(--panel); border:1px solid var(--gold-dim); border-radius:20px; padding:3px 6px; z-index:1; white-space:nowrap; writing-mode:vertical-rl; text-orientation:mixed;}

/* ===== Display v3: peta gabungan, kolom = per stall ===== */
.stallcolset{display:flex; gap:6px;}
.stallcol{flex:1; display:flex; flex-direction:column;}
.colhead{text-align:center; font-size:12px; font-weight:800; color:var(--gold); padding:2px 0 6px; letter-spacing:0.03em;}
.colhead .n{display:block; font-size:9px; color:var(--text-dim); font-weight:600;}
.gridblock.back .colhead{color:var(--text-dim);}
.cellstack{display:flex; flex-direction:column; gap:4px;}
.cellstack .yardcell{min-height:44px;}
.linechip{border:1.5px solid var(--border);background:var(--panel);color:var(--text);border-radius:999px;padding:8px 18px;font-weight:700;font-size:14px;cursor:pointer;}
.linechip.on{background:var(--gold);color:#fff;border-color:var(--gold);}

/* =====================================================================
   ADAPTIVE LAYOUT — HP (<700) · Tablet (700–1099) · Laptop/PC (≥1100)
   ===================================================================== */
#viewport{min-width:0;}
.alertcard{border:2px solid #D64545 !important; background:#FDECEC !important;}
.stallgrid{display:block;}
.split,.ydesk,.yleft,.ymap,.dl-left,.dl-right{display:contents;}
.yardwrap{display:flex; flex-direction:column;}
.dlbatches{margin-top:18px;}
@media(min-width:900px){.dlbatches{margin-top:0;}}

/* ---------- Tablet & ke atas ---------- */
@media(min-width:700px){
  #app{max-width:none; box-shadow:none; background:var(--bg);}
  .loginwrap{max-width:560px; margin:0 auto; width:100%;}
  .rolegrid{display:grid; grid-template-columns:repeat(2,1fr);}
  .topbar{display:grid; grid-template-columns:1fr auto; grid-template-areas:"brand user" "sub user"; align-items:center; column-gap:16px; padding:12px 24px;}
  .topbar .brand{grid-area:brand;} .topbar .sub{grid-area:sub; margin-top:0;}
  .topbar .userchip{grid-area:user; margin-top:0; gap:14px; justify-content:flex-end;}
  .tabbar{padding:10px 24px; flex-wrap:wrap; overflow-x:visible;}
  .view{padding:20px 24px 48px; max-width:1500px; width:100%; margin:0 auto;}
  .stallgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px 16px;}
  .stallgroup{margin-bottom:8px;}
  .modal{border-radius:18px; align-self:center;}
  /* kartu mengalir 2 kolom untuk halaman data */
  #viewport.v-dashboard,#viewport.v-ccplan,#viewport.v-admin,#viewport.v-koordinator,#viewport.v-orderstall,
  #viewport.v-batam,#viewport.v-prio,#viewport.v-dccp,#viewport.v-datadefect,#viewport.v-confirmdefect{
    display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; align-items:start; align-content:start;}
  #viewport.v-dashboard>*,#viewport.v-ccplan>*,#viewport.v-admin>*,#viewport.v-koordinator>*,#viewport.v-orderstall>*,
  #viewport.v-batam>*,#viewport.v-prio>*,#viewport.v-dccp>*,#viewport.v-datadefect>*,#viewport.v-confirmdefect>*{margin-bottom:0 !important; min-width:0;}
  #viewport[class*="v-"]>:not(.card){grid-column:1/-1;}
  #viewport.v-dashboard>.card:has(table),#viewport.v-ccplan>.card:has(table),#viewport.v-admin>.card:has(table),
  #viewport.v-dccp>.card:has(table),#viewport.v-batam>.card:has(table),#viewport.v-prio>.card:has(table),
  #viewport.v-datadefect>.card:has(table),#viewport.v-confirmdefect>.card:has(table),#viewport.v-dashboard>.alertcard{grid-column:1/-1;}
  #viewport.v-dashboard>.card:has(.wide2){grid-column:1/-1;}
  .yardwrap{display:flex; flex-direction:column;}
}
/* draft ILS */
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.dchip{background:#fff;border:1px solid var(--border);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600;}
@media(min-width:900px){ #viewport.v-delivery>.dl-draft{grid-column:1/-1;} }
/* ---------- Hanya HP & tablet kecil: urutan Display ---------- */
@media(max-width:1099px){
  .yardwrap>.alertcard{order:0;} .yardwrap .y-sum{order:1;} .yardwrap .y-cc{order:2;} .yardwrap .y-sched{order:3;}
  .yardwrap .stallblock{order:4;} .yardwrap .y-off{order:5;} .yardwrap .y-queue{order:6;} .yardwrap .footnote{order:9;}
  .yardwrap>.ydesk,.yardwrap .yleft,.yardwrap .ymap{display:contents;}
}
/* ---------- Tablet landscape / laptop: Dispatcher & Delivery 2 kolom ---------- */
@media(min-width:900px){
  #viewport.v-dispatcher{display:grid; grid-template-columns:minmax(340px,5fr) minmax(0,7fr); gap:16px; align-items:start; grid-template-areas:"scan slots" "offin slots" "confirm slots" "offlist slots"; grid-template-rows:auto auto auto 1fr;}
  #viewport.v-dispatcher>*{margin-bottom:0 !important;}
  #viewport.v-dispatcher>.d-scan{grid-area:scan;} #viewport.v-dispatcher>.d-slots{grid-area:slots;}
  #viewport.v-dispatcher>.d-offin{grid-area:offin;} #viewport.v-dispatcher>.d-offlist{grid-area:offlist;}
  #viewport.v-dispatcher>.d-confirm{grid-area:confirm;}
  #viewport.v-dispatcher .stallgrid{grid-template-columns:repeat(2,minmax(0,1fr));}
  #viewport.v-delivery{display:grid; grid-template-columns:minmax(340px,5fr) minmax(0,7fr); gap:16px; align-items:start;}
  #viewport.v-delivery>.dl-left{display:block;grid-column:1;min-width:0;} #viewport.v-delivery>.dl-right{display:block;grid-column:2;min-width:0;}
  #viewport.v-delivery>.alertcard{grid-column:1/-1;}
  .slot{min-height:58px;}
  .unitlist{max-height:calc(100vh - 380px); min-height:260px; overflow-y:auto; padding-right:4px;}
  #viewport.v-dashboard>.card:first-child{grid-column:1/-1;}
}
@media(min-width:1600px){ #viewport.v-dispatcher .stallgrid{grid-template-columns:repeat(4,minmax(0,1fr));} }
/* ---------- Laptop / PC: sidebar menu di kiri ---------- */
@media(min-width:1100px){
  #mainView:not(.hidden){display:grid !important; grid-template-columns:236px minmax(0,1fr); grid-template-rows:auto 1fr; grid-template-areas:"top top" "side main"; min-height:100vh;}
  #mainView:has(#tabbar.hidden){grid-template-columns:minmax(0,1fr); grid-template-areas:"top" "main";}
  .topbar{grid-area:top; padding:12px 28px;}
  .tabbar{grid-area:side; flex-direction:column; flex-wrap:nowrap; align-items:stretch; gap:4px; padding:16px 12px; border-right:1px solid var(--border); border-bottom:none; position:sticky; top:68px; align-self:start; height:calc(100vh - 68px); overflow-y:auto;}
  .tabbtn{text-align:left; padding:11px 14px; font-size:14px;}
  .view{grid-area:main; padding:24px 32px 56px;}
  .yardwrap{display:block;}
  .yardwrap>.ydesk{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:16px; align-items:start; margin-bottom:16px;}
  .yardwrap .yleft,.yardwrap .ymap{display:block; min-width:0;}
  .yardwrap .stallblock{margin-bottom:0;}
  .yardwrap>.y-sched{margin-bottom:16px;}
  .yardwrap .yleft>.card:last-child{margin-bottom:0;}
}

<script>
/* ======================================================================
   DATA LAYER
   Saat ini pakai localStorage (per-browser, belum sinkron antar device).
   Semua akses data lewat objek DB di bawah ini -- supaya nanti gampang
   diganti jadi fetch() ke Power Automate HTTP trigger (Microsoft 365 /
   SharePoint / Excel Online) tanpa perlu bongkar ulang seluruh app.
   Tinggal isi endpoint di CONFIG.ENDPOINTS lalu ganti isi fungsi DB.* .
====================================================================== */
const CONFIG = {
  SESSION_HOURS: 6,
  MAX_LOAD_PER_CC: 6,
  STALL_GROUPS: ["17A","17B","16A","16B","15A","15B","14A","14B"],
  SLOTS_PER_STALL: 6,
  CC_TOTAL: 5,
  CC_ACTIVE_DEFAULT: [1,2,3],
  CC_EMERGENCY: [4,5],
  ENDPOINTS: {
    // TODO: isi nanti dengan URL webhook Power Automate, contoh:
    // getUnits: "https://prod-xx.westus.logic.azure.com/workflows/xxxx/triggers/manual/paths/invoke?...",
  }
};

const LS_KEY = "apcc_db_v8";

function seedDB(){
  const units = {};
  CONFIG.STALL_GROUPS.forEach(g=>{
    for(let i=1;i<=CONFIG.SLOTS_PER_STALL;i++){ units[g+i] = null; }
  });
  const cc = {};
  for(let i=1;i<=CONFIG.CC_TOTAL;i++){ cc[i] = null; }

  return {
    units,
    cc,
    ccOpen: {4:false, 5:false}, // stall darurat, default tertutup
    logClearTs: 0, // waktu terakhir 'Bersihkan Data Uji' (disinkron ke semua perangkat)
    queue: [], // {plat, lp, ts}
    ils: [], // {id, ccNum, ccPlat, lp, units:[{slot,frame,model}], mp, ts, status}
    models: {
      AGYA:  {vin_codes:["BC"], color:"#3C86D4"},
      AVANZA:{vin_codes:["AY","BY"], color:"#8E5BD6"},
      CALYA: {vin_codes:["J3","K6","J6"], color:"#E3B23C"},
      RAIZE: {vin_codes:["BA"], color:"#DE4B4B"},
      RUSH:  {vin_codes:["TH"], color:"#B8860B"},
      VELOZ: {vin_codes:["DM"], color:"#8A6C24"},
    },
    users: [
      {username:"user", password:"user", role:"dispatcher", name:"Dispatcher"},
      {username:"user", password:"user", role:"cc",         name:"Order Stall CC"},
      {username:"user", password:"user", role:"delivery",   name:"MP Delivery"},
      {username:"user", password:"user", role:"koordinator",name:"Koordinator"},
      {username:"user", password:"user", role:"leader",     name:"Leader"},
      {username:"user", password:"user", role:"admin",      name:"Administrator"},
    ],
    defects: [], // {id, frame, model, defectType, part, side, position, photo, reportedBy, ts, status, confirmedBy, confirmedTs}
    defectTypes: ["Baret (Scratch)","Dent","Ding","Gompal","Beda Warna","Lecet","Pecah","Kotor/Stain"],
    defectParts: ["Bumper Depan","Bumper Belakang","Pintu Depan","Pintu Tengah","Pintu Belakang","Backdoor","Opening Door","Fender","Kap Mesin","Atap","Kaca","Spion","Velg"],
    lpList: ["KMDI","TOP","PAM","PNJ","KPL","ANG","ACT"],
    yardLocation: { lat: null, lng: null, radiusKm: 5 },
    dccpSchedule: [], // {lp, police, model, driver, schedTime, dest, uploadedAt}
    dccpMeta: { fileName: "", uploadedAt: null, uploadedBy: "" },
    prodPlan: {}, // {"YYYY-MM-DD": {s1:{MODEL:n}, s2:{MODEL:n}}}
  };
}

/* ======================================================================
   DATA LAYER + SINKRONISASI FIREBASE (Realtime Database)
   - DB.get()/DB.set() tetap sinkron (membaca cache memori) sehingga seluruh kode lama tidak berubah.
   - Tiap perubahan ditulis ke Firebase PER KUNCI (units, cc, queue, ils, ...) lewat transaction,
     jadi dua HP yang mengubah data bersamaan tidak saling menimpa.
   - Cache lokal (localStorage) tetap dipakai sebagai cadangan kalau sinyal putus.
   - unitLog hanya lokal (diturunkan otomatis dari units + ils).
====================================================================== */
const FB_CONFIG = {
  apiKey: "AIzaSyAkLYZ6voYE2rpH6F5feRV3MJf1r8bC6YA",
  authDomain: "radar-tam.firebaseapp.com",
  databaseURL: "https://radar-tam-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "radar-tam",
  storageBucket: "radar-tam.firebasestorage.app",
  messagingSenderId: "4334079340",
  appId: "1:4334079340:web:7d0a856c605eedd1667749"
};
const FB_ROOT = "radar";
const LOCAL_ONLY = ["unitLog","unitLogMigrated","migAvanzaBY"];
const FBS = { enabled:false, authed:false, conn:false, ready:false, db:null, q:[] };
let _mem = null;
function cloneJ(o){ return JSON.parse(JSON.stringify(o)); }
function dbKeys(d){ return Object.keys(d).filter(k=>LOCAL_ONLY.indexOf(k)<0); }
/* Firebase membuang array/objek kosong & mengubah objek ber-kunci angka jadi array → kembalikan ke bentuk yang dipakai aplikasi */
function normalizeData(raw){
  const seed = seedDB(), d = (raw && typeof raw==="object") ? raw : {};
  for(const k of Object.keys(seed)){ if(d[k]===undefined || d[k]===null) d[k] = seed[k]; }
  ["queue","ils","defects","defectTypes","defectParts","lpList","dccpSchedule","users"].forEach(k=>{
    if(!Array.isArray(d[k])) d[k] = (d[k] && typeof d[k]==="object") ? Object.values(d[k]) : [];
  });
  const toObj = v=>{ if(Array.isArray(v)){ const o={}; v.forEach((x,i)=>{ if(x!==null && x!==undefined) o[i]=x; }); return o; } return v || {}; };
  d.cc = toObj(d.cc); for(let i=1;i<=CONFIG.CC_TOTAL;i++){ if(d.cc[i]===undefined) d.cc[i] = null; }
  d.ccOpen = toObj(d.ccOpen);
  d.units = d.units || {};
  for(const k of Object.keys(seed.units)){ if(d.units[k]===undefined) d.units[k] = null; }
  (d.ils||[]).forEach(b=>{ if(b && !Array.isArray(b.units)) b.units = b.units ? Object.values(b.units) : []; });
  return d;
}
/* Jalankan mutator dengan waktu & random yang DIBEKUKAN → hasil identik di setiap percobaan ulang transaction */
function runMut(d, fn, T, seed){
  const rn = Date.now, rr = Math.random; let s = seed>>>0;
  Date.now = ()=>T;
  Math.random = ()=>{ s=(s+0x6D2B79F5)>>>0; let t=s; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; };
  try{ fn(d); syncUnitLog(d); } finally { Date.now = rn; Math.random = rr; }
}
function fbState(s){
  const el = document.getElementById("syncBadge"); if(!el) return;
  const map = {online:["sync-on","● Online"], connecting:["sync-wait","◌ Menyambung…"], offline:["sync-off","○ Offline"], off:["sync-local","● Lokal"]};
  const m = map[s] || map.off; el.className = "syncb "+m[0]; el.textContent = m[1];
}
function fbCurrentState(){ return !FBS.enabled ? "off" : (!FBS.authed ? "connecting" : (FBS.conn ? (FBS.ready?"online":"connecting") : "offline")); }
function fbPush(k, pre, fn, T, seed){
  if(!FBS.enabled) return;
  if(!FBS.ready){ FBS.q.push([k,pre,fn,T,seed]); return; }
  FBS.db.ref(FB_ROOT+"/"+k).transaction(cur=>{
    const tmp = cloneJ(pre);
    if(cur!==null && cur!==undefined) tmp[k] = cur;
    const nt = normalizeData(tmp);
    runMut(nt, fn, T, seed);
    const v = cloneJ(nt[k]);
    return v===undefined ? null : v;
  }, (err)=>{ if(err) console.warn("sync gagal:", k, err); }, true);
}
function fbStart(){
  if(typeof firebase === "undefined" || !/^https?:/.test(location.protocol)){ fbState("off"); return; }
  try{
    firebase.initializeApp(FB_CONFIG);
    FBS.db = firebase.database(); FBS.enabled = true; fbState("connecting");
    FBS.db.ref(".info/connected").on("value", s=>{ FBS.conn = !!s.val(); fbState(fbCurrentState()); });
    firebase.auth().signInAnonymously().then(()=>{ FBS.authed = true; fbState(fbCurrentState()); fbAttach(); })
      .catch(e=>{ console.warn("login anonim gagal", e); fbState("offline"); });
  }catch(e){ console.warn(e); fbState("off"); }
}
function fbAttach(){
  const ref = FBS.db.ref(FB_ROOT);
  ref.on("value", snap=>{
    const v = snap.val(), local = DB.load();
    if(v === null){
      // database masih kosong → data perangkat ini jadi data awal
      const o = {}; dbKeys(local).forEach(k=>{ o[k] = cloneJ(local[k]); });
      FBS.ready = true; ref.set(o).catch(e=>console.warn(e)); fbState(fbCurrentState()); return;
    }
    const d = normalizeData(v);
    LOCAL_ONLY.forEach(k=>{ if(local[k]!==undefined) d[k] = local[k]; });
    syncUnitLog(d);
    DB.save(d);
    const wasReady = FBS.ready; FBS.ready = true; fbState(fbCurrentState());
    if(!wasReady && FBS.q.length){ const q = FBS.q; FBS.q = []; q.forEach(a=>fbPush.apply(null,a)); }
    fbRender();
  }, err=>{ console.warn("listener ditolak:", err); fbState("offline"); });
}
function fbRender(){
  const mv = document.getElementById("mainView"); if(!mv || mv.classList.contains("hidden")) return;
  const a = document.activeElement, typing = a && (a.tagName==="INPUT" || a.tagName==="TEXTAREA" || a.tagName==="SELECT");
  if(typing || (typeof scanStream!=="undefined" && scanStream) || activeTab==="defect" || (typeof dccpEditIdx!=="undefined" && dccpEditIdx!==null)) return;
  _autoRender = true; try{ render(); } finally { _autoRender = false; }
}
const DB = {
  load(){
    if(_mem) return _mem;
    let raw = null; try{ raw = localStorage.getItem(LS_KEY); }catch(e){}
    let d = null; if(raw){ try{ d = JSON.parse(raw); }catch(e){ d = null; } }
    _mem = normalizeData(d || seedDB());
    try{ localStorage.setItem(LS_KEY, JSON.stringify(_mem)); }catch(e){}
    return _mem;
  },
  save(data){ _mem = data; try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){} },
  get(){ return this.load(); },
  set(mutatorFn){
    const data = this.load();
    const pre = cloneJ(data);
    const T = Date.now(), seed = (T ^ 0x9e3779b9) >>> 0;
    runMut(data, mutatorFn, T, seed);
    const keys = dbKeys(data).filter(k=> JSON.stringify(data[k]) !== JSON.stringify(pre[k]));
    this.save(data);
    keys.forEach(k=> fbPush(k, pre, mutatorFn, T, seed));
    render();
  }
};

const SESS_KEY = "apcc_session_v1";
function getSession(){
  try{
    const s = JSON.parse(localStorage.getItem(SESS_KEY) || "null");
    if(!s) return null;
    if(Date.now() > s.expiry){ localStorage.removeItem(SESS_KEY); return null; }
    return s;
  }catch(e){ return null; }
}
function setSession(user){

  localStorage.setItem(SESS_KEY, JSON.stringify(s));
  return s;
}

/* ===== Model detection dari No. Rangka (VIN) =====
   Kode model ada di karakter posisi ke-7 & ke-8 (index 6:8), sama
   seperti logic di Toyota PDI System v50.                         */
function detectModel(vin, models){
  vin = (vin||"").toUpperCase().trim();
  if(vin.length < 8) return null;
  const kode = vin.substring(6,8);
  for(const [mdl, cfg] of Object.entries(models)){
    if((cfg.vin_codes||[]).includes(kode)) return mdl;
  }
  return null;
}
function getModelColor(model, data){
  return (data.models[model] && data.models[model].color) || '#DE4B4B';
}

function render(){
  // Simpan posisi scroll (geser kiri/kanan & atas/bawah) agar tidak lompat saat auto-refresh
  const vpEl = document.getElementById("viewport");
  const saved = [];
  if(vpEl){
    vpEl.querySelectorAll("*").forEach((el,i)=>{ if(el.scrollLeft>0 || el.scrollTop>0) saved.push([i, el.scrollLeft, el.scrollTop]); });
  }
  const winY = window.scrollY, winX = window.scrollX;
  renderInner();
  if(vpEl){
    const all = vpEl.querySelectorAll("*");
    saved.forEach(([i,l,t])=>{ const el = all[i]; if(el){ el.scrollLeft = l; el.scrollTop = t; } });
  }
  if(window.scrollY!==winY || window.scrollX!==winX) window.scrollTo(winX, winY);
}

function findVinSlot(vin, data, excludeSlot){
  for(const [slotId, v] of Object.entries(data.units)){
    if(v && v.frame===vin && slotId!==excludeSlot) return slotId;
  }
  return null;
}
function quickParkOK(){
  if(!requireLine()) return;
  const vin = document.getElementById("vinInput").value.trim().toUpperCase();
  const data = DB.get();
  if(!vin){ alert("Isi No. Rangka dulu."); return; }
  const dupSlot = findVinSlot(vin, data);
  if(dupSlot && !isOffKey(dupSlot)){ alert(`No. Rangka ini masih terparkir di stall ${dupSlot}. Keluarkan/scan-out dulu sebelum input ulang.`); return; }
  const offKey = dupSlot || null;
  if(offKey && data.units[offKey].ilsId){ alert("Unit ini sudah masuk ILS (sedang loading), tidak bisa dipindah ke stall."); return; }
  const model = detectModel(vin, data.models);
  if(!model){ alert("Model tidak terdeteksi dari No. Rangka. Periksa kembali atau tambahkan kode di Admin Panel."); return; }
  const _cat = lookupUnitCat(data, vin), _isB = !!(_cat && _cat.batam) || batamManual;
  const slot = pickedSlot || findFirstEmptySlot(data, _isB);
  if(!slot){ alert(_isB && batamStallList(data).length ? "Stall khusus BATAM penuh / tidak ada slot kosong." : (batamStallList(data).length ? "Stall reguler penuh / tidak ada slot kosong." : "Semua stall penuh, tidak ada slot kosong.")); return; }
  if(!slotAllowed(data, slot, _isB)){ alert(`Slot ${slot} untuk unit ${_isB?"reguler":"BATAM"}. Unit ${_isB?"BATAM":"reguler"} tidak boleh dicampur — pilih stall yang sesuai.`); return; }
  DB.set(d=>{
    d.units[slot] = makeUnitRecord(vin, model, d);
    if(offKey) moveOffToSlot(d, offKey, slot);
  });
  pickedSlot = null;
  document.getElementById("vinInput").value = ""; vinDraft = ""; batamManual = false; prioManual = false; specialAlertVin = "";
  stopScanner();
  render();
}

  { const ok = findVinSlot(normVin(vin).length>=8?vin.trim().toUpperCase():"", data); if(ok && isOffKey(ok)) banner += `<div style="background:#FFF3E0;border:2px solid #E8833A;border-radius:12px;padding:10px;text-align:center;font-size:13px;margin-bottom:8px;">📍 Unit ini tercatat parkir di luar stall: <b>${data.units[ok].loc||"-"}</b><br>Tekan OK / pilih slot untuk <b>memindahkan datanya ke stall</b>.</div>`; }
  if(isB) banner += `<div style="background:#E8833A;color:#fff;border-radius:12px;padding:14px;text-align:center;font-size:20px;font-weight:800;margin-bottom:8px;">🟠 UNIT BATAM${cat&&cat.dest?`<div style="font-size:12px;font-weight:600;">Tujuan: ${cat.dest}</div>`:""}${restricted?`<div style="font-size:12px;font-weight:600;">Parkir di stall khusus Batam: ${batamStallList(data).join(", ")}</div>`:""}</div>`;
  if((cat && cat.prio) || prioManual) banner += `<div style="background:#F5B800;color:#3a2a00;border-radius:12px;padding:12px;text-align:center;font-size:18px;font-weight:800;margin-bottom:8px;">⭐ UNIT PRIORITAS</div>`;
  if(model){
    // slot terpilih otomatis yang jenisnya salah → ganti
    if(pickedSlot && pickedAuto && !slotAllowed(data, pickedSlot, isB)){ pickedSlot = null; }
    if(!pickedSlot){
      pickedSlot = findFirstEmptySlot(data, isB); pickedAuto = true;

    }
    if(pickedSlot && !slotAllowed(data, pickedSlot, isB)){
      el.innerHTML = banner + `<div class="msg err">Slot <b>${pickedSlot}</b> untuk unit ${isB?"reguler":"BATAM"}. Unit ${isB?"BATAM":"reguler"} tidak boleh dicampur — pilih slot di stall yang sesuai.</div>`;
    }else if(pickedSlot){
      el.innerHTML = banner + `<div class="msg ok">Model terdeteksi: <b>${model}</b> — akan diparkir ke stall <b>${pickedSlot}</b></div>`;
    }else{
      el.innerHTML = banner + `<div class="msg ok">Model terdeteksi: <b>${model}</b></div><div class="msg err">${isB&&restricted?"Stall khusus BATAM penuh.":(restricted?"Stall reguler penuh.":"Semua stall penuh, tidak ada slot kosong.")}</div>`;
    }
  }else if(vin.length>=8){

  }else{
    el.innerHTML = banner + `<div class="msg info">Ketik minimal 8 karakter No. Rangka...</div>`;
  }
  // Pop up sekali per No. Rangka untuk unit Batam / Prioritas
  const isP = !!(cat && cat.prio) || prioManual;
  const key = normVin(vin) + "|" + (isB?"B":"") + (isP?"P":"");
  if(model && (isB || isP) && key !== specialAlertVin && (cat || batamManual || prioManual)){
    specialAlertVin = key;
    showSpecialPopup(normVin(vin), isB, isP, cat, (pickedSlot && slotAllowed(data,pickedSlot,isB)) ? pickedSlot : null, model);
  }
}
function confirmPark(){

/* Scanner: BarcodeDetector bawaan browser (QR, Data Matrix, Code128/39, PDF417) + cadangan jsQR */
let scanDet = null, scanBusy = false, scanLast = 0, scanFrames = 0;
function vinFromScan(t){
  t = String(t||"").trim().toUpperCase();
  const m = t.match(/(?:^|[^A-Z0-9])([A-HJ-NPR-Z0-9]{17})(?:[^A-Z0-9]|$)/);
  return m ? m[1] : null;   // hanya No. Rangka 17 karakter yang diterima
}
function scanStatus(msg){ const e=document.getElementById("scanStat"); if(e) e.textContent=msg; }
function onScanned(txt){
  const v = vinFromScan(txt) || String(txt||"").trim().toUpperCase();
  const inp = document.getElementById("vinInput");
  if(inp) inp.value = v;
  vinDraft = v;
  try{ navigator.vibrate && navigator.vibrate(120); }catch(e){}
  onVinInput();
  stopScanner();
}
function makeDetector(){
  if(scanDet) return scanDet;
  try{
    if("BarcodeDetector" in window){
      scanDet = new BarcodeDetector({formats:["qr_code"]});
    }
  }catch(e){ scanDet = null; }
  return scanDet;
}
let jsqrTried = false;
function ensureJsQR(){
  if(typeof jsQR==="function" || jsqrTried) return;
  jsqrTried = true;
  const sc = document.createElement("script");
  sc.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
  document.head.appendChild(sc);
}
async function decodeSource(src, w, h){
  ensureJsQR();
  const det = makeDetector();
  if(det){
    try{ const r = await det.detect(src); for(const x of (r||[])){ if(vinFromScan(x.rawValue)) return x.rawValue; } }catch(e){}
  }
  if(typeof jsQR === "function"){
    const c = document.createElement("canvas");
    const sc = Math.min(1, 1400/Math.max(w,h));
    c.width = Math.round(w*sc); c.height = Math.round(h*sc);
    const x = c.getContext("2d", {willReadFrequently:true});
    x.drawImage(src,0,0,c.width,c.height);
    const img = x.getImageData(0,0,c.width,c.height);
    const code = jsQR(img.data, img.width, img.height, {inversionAttempts:"attemptBoth"});
    if(code && code.data && vinFromScan(code.data)) return code.data;
  }
  return null;
}
function toggleScanner(){
  const area = document.getElementById("scanArea");
  if(scanStream){ stopScanner(); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    area.innerHTML = `<div class="msg err">Browser ini tidak mengizinkan kamera (harus lewat https). Pakai tombol Foto di bawah atau ketik manual.</div>${scanPhotoBtn()}`;
    return;
  }
  area.innerHTML = `<div class="scanbox"><video id="scanVideo" playsinline muted></video><div class="frame"></div></div>
    <div id="scanStat" style="font-size:12px;color:var(--text-dim);margin-bottom:6px;">Menyalakan kamera…</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;"><button type="button" class="btn btn-outline" id="torchBtn" onclick="toggleTorch()">🔦 Flash: Mati</button><button type="button" class="btn btn-outline" onclick="scanZoom(-0.5)">🔍−</button><button type="button" class="btn btn-outline" id="zoomBtn" onclick="scanZoom(0.5)">🔍+ 1x</button><button type="button" class="btn btn-outline" onclick="scanShot()">📷 Ambil &amp; Baca</button>${scanPhotoBtn()}</div>`;
  const video = document.getElementById("scanVideo");
  const tryGet = c => navigator.mediaDevices.getUserMedia(c);
  tryGet({video:{facingMode:{ideal:"environment"}, width:{ideal:1920}, height:{ideal:1080}}})
  .catch(()=>tryGet({video:true}))
  .then(stream=>{
    scanStream = stream; scanFrames = 0;
    video.srcObject = stream;
    video.setAttribute("playsinline", true);
    video.play();
    try{
      const tr = stream.getVideoTracks()[0];
      const cap = tr.getCapabilities ? tr.getCapabilities() : {};
      if(cap.focusMode && cap.focusMode.includes("continuous")) tr.applyConstraints({advanced:[{focusMode:"continuous"}]}).catch(()=>{});
      setTimeout(()=>{ if(scanStream) toggleTorch(true); }, 700);
      scanZ = 1; if(cap.zoom){ scanZ = Math.min(cap.zoom.max||1, Math.max(cap.zoom.min||1, 1.5)); tr.applyConstraints({advanced:[{zoom:scanZ}]}).catch(()=>{}); const zb=document.getElementById("zoomBtn"); if(zb) zb.textContent="🔍+ "+scanZ.toFixed(1)+"x"; }
    }catch(e){}
    document.getElementById("scanToggleBtn").textContent = "✕ Tutup Kamera";
    const eng = makeDetector() ? "pembaca bawaan" : (typeof jsQR==="function" ? "jsQR" : "TIDAK ADA PEMBACA");
    scanStatus("Taruh QR tepat di dalam bingkai kuning (hanya QR yang dibaca), jarak ±15–25 cm, tahan stabil. (" + eng + ")");
    requestAnimationFrame(scanLoop);
  }).catch(err=>{
    area.innerHTML = `<div class="msg err">Tidak bisa akses kamera: ${err.name||""} ${err.message||""}. Izinkan kamera di pengaturan browser, atau pakai tombol Foto / ketik manual.</div>${scanPhotoBtn()}`;
  });
}
function scanPhotoBtn(){
  return `<label class="btn btn-outline" style="cursor:pointer;display:inline-block;">📸 Foto Kode<input type="file" accept="image/*" capture="environment" style="display:none" onchange="scanFromPhoto(this)"></label>`;
}
async function scanFromPhoto(inp){
  const f = inp.files && inp.files[0]; if(!f) return;
  scanStatus("Membaca foto…");
  try{
    const bmp = await createImageBitmap(f);
    const txt = await decodeSource(bmp, bmp.width, bmp.height);
    if(txt){ onScanned(txt); return; }
    const area = document.getElementById("scanArea");
    if(area) area.insertAdjacentHTML("beforeend", `<div class="msg err">Kode tidak terbaca di foto. Dekatkan, pastikan tajam dan tidak silau, lalu ulangi. Atau ketik No. Rangka manual.</div>`);
  }catch(e){ alert("Gagal membaca foto: "+e.message); }
  inp.value = "";
}
async function toggleTorch(on){
  const tb=document.getElementById("torchBtn");
  try{
    if(!scanStream) return;
    const tr = scanStream.getVideoTracks()[0];
    const want = (typeof on==="boolean") ? on : !scanTorch;
    await tr.applyConstraints({advanced:[{torch:want}]});
    const st = tr.getSettings ? tr.getSettings() : {};
    if(want && st.torch===false) throw new Error("torch off");
    scanTorch = want;
    if(tb) tb.textContent = scanTorch ? "🔦 Flash: Nyala" : "🔦 Flash: Mati";
  }catch(e){
    scanTorch = false;
    if(tb) tb.textContent = "🔦 Flash: Mati";
    scanStatus("Flash tidak bisa dinyalakan dari browser ini (iPhone/Safari tidak mendukung). Coba Chrome di Android, atau nyalakan senter dari panel HP.");
  }
}
let scanTorch = false, scanZ = 1;
async function scanZoom(d){
  try{
    const tr = scanStream.getVideoTracks()[0];
    const cap = tr.getCapabilities ? tr.getCapabilities() : {};
    if(!cap.zoom){ scanStatus("Zoom tidak didukung browser ini. Jauhkan HP ±25 cm lalu pakai Ambil & Baca."); return; }
    scanZ = Math.min(cap.zoom.max, Math.max(cap.zoom.min, scanZ + d));
    await tr.applyConstraints({advanced:[{zoom:scanZ}]});
    const zb=document.getElementById("zoomBtn"); if(zb) zb.textContent="🔍+ "+scanZ.toFixed(1)+"x";
  }catch(e){ scanStatus("Zoom gagal: "+e.message); }
}
async function scanShot(){
  scanStatus("Mengambil foto…");
  try{
    const tr = scanStream.getVideoTracks()[0];
    let bmp = null;
    if("ImageCapture" in window){
      try{ const blob = await new ImageCapture(tr).takePhoto(); bmp = await createImageBitmap(blob); }catch(e){}
    }
    if(!bmp){ const v=document.getElementById("scanVideo"); bmp = await createImageBitmap(v); }
    const txt = await decodeSource(bmp, bmp.width, bmp.height);
    if(txt){ onScanned(txt); return; }
    scanStatus("Belum terbaca. Jauhkan sedikit (±20–30 cm) sampai QR tajam, lalu ulangi.");
  }catch(e){ scanStatus("Gagal ambil foto: "+e.message); }
}
function stopScanner(){
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
  scanTorch = false;
  const btn = document.getElementById("scanToggleBtn");
  if(btn) btn.textContent = "📷 Buka Kamera Scan QR";
  const area = document.getElementById("scanArea");
  if(area) area.innerHTML = "";
}
let scanPrev = "", scanCan = null;
async function scanLoop(ts){
  if(!scanStream) return;
  const video = document.getElementById("scanVideo");
  if(video && video.readyState>=2 && video.videoWidth && !scanBusy && (ts||0)-scanLast>140){
    scanBusy = true; scanLast = ts||0; scanFrames++;
    try{
      // baca hanya area di dalam bingkai (tengah 60%)
      const vw = video.videoWidth, vh = video.videoHeight;
      const cw = Math.round(vw*0.6), ch = Math.round(vh*0.6);
      if(!scanCan) scanCan = document.createElement("canvas");
      scanCan.width = cw; scanCan.height = ch;
      scanCan.getContext("2d",{willReadFrequently:true}).drawImage(video, Math.round(vw*0.2), Math.round(vh*0.2), cw, ch, 0, 0, cw, ch);
      const txt = await decodeSource(scanCan, cw, ch);
      const v = txt ? vinFromScan(txt) : null;
      if(v){
        if(v===scanPrev && scanStream){ scanBusy=false; scanPrev=""; onScanned(v); return; }   // harus terbaca 2x berturut-turut
        scanPrev = v; scanStatus("Terbaca "+v+" — tahan sebentar…");
      } else { scanPrev = ""; }
      if(scanFrames===40 && !makeDetector() && typeof jsQR!=="function") scanStatus("Pembaca kode gagal dimuat (internet?). Pakai tombol Foto atau ketik manual.");
    }catch(e){}
    scanBusy = false;
  }
  requestAnimationFrame(scanLoop);
}

let absenState = { verified:false, distanceKm:null };
let autoWatchId = null;

function playAlarmSound(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<3;i++){
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = 880;
      g.gain.value = 0.18;
      o.connect(g); g.connect(ctx.destination);
      const start = ctx.currentTime + i*0.35;
      o.start(start);
      o.stop(start+0.25);
    }
  }catch(e){}
}

function toggleAutoWatch(){
  const data = DB.get();
  const msgEl = document.getElementById("absenMsg");
  if(data.yardLocation.lat==null){
    if(msgEl) msgEl.innerHTML = `<div class="msg err">Lokasi yard belum diatur Admin.</div>`;
    return;
  }
  if(autoWatchId){
    navigator.geolocation.clearWatch(autoWatchId);
    autoWatchId = null;
    render();
    return;
  }
  try{ const ctx = new (window.AudioContext||window.webkitAudioContext)(); ctx.resume(); }catch(e){}
  requestNotifPermission();
  if(msgEl) msgEl.innerHTML = `<div class="msg info">🔔 Mode pantau otomatis aktif — nanti bunyi & absen otomatis begitu masuk radius. Jangan tutup app.</div>`;

  autoWatchId = navigator.geolocation.watchPosition(
    pos=>{
      if(absenState.verified) return;
      const d = DB.get();
      const dist = haversineKm(pos.coords.latitude, pos.coords.longitude, d.yardLocation.lat, d.yardLocation.lng);
      if(dist <= d.yardLocation.radiusKm){
        absenState = {verified:true, distanceKm:dist};
        playAlarmSound();
        if(navigator.vibrate) navigator.vibrate([300,150,300,150,300]);
        if('Notification' in window && Notification.permission==='granted'){
          try{ new Notification('📍 Sudah Masuk Radius Yard', {body:`Jarak ${dist.toFixed(1)} km — absen otomatis tercatat.`}); }catch(e){}
        }
        if(autoWatchId){ navigator.geolocation.clearWatch(autoWatchId); autoWatchId=null; }
        render();
      }
    },
    err=>{ /* diamkan supaya tidak spam kalau sinyal GPS sempat hilang */ },
    {enableHighAccuracy:true, maximumAge:10000, timeout:20000}
  );
  render();
}


/* ===== ABSEN OTOMATIS (GPS HP driver) =====
   Driver cukup mengaktifkan sekali. Begitu HP berada dalam radius yard (default 5 km),
   truk otomatis didaftarkan ke stall kosong / antrian — tanpa klik. */
const CCP_KEY = "apcc_ccprofile", CCAUTO_KEY = "apcc_ccauto";
let autoAbsen = { on:false, id:null, wake:null, state:"armed", hits:0, dist:null, acc:null, ts:0, msg:"", err:"" };
function getCcProfile(){ try{ const o = JSON.parse(localStorage.getItem(CCP_KEY)||"null"); return o && typeof o==="object" ? o : {plat:"",lp:""}; }catch(e){ return {plat:"",lp:""}; } }
function saveCcProfile(){
  const plat = (document.getElementById("ccpPlat").value||"").trim().toUpperCase();
  const lp = (document.getElementById("ccpLP").value||"").trim();
  if(!plat || !lp){ alert("Isi nomor polisi dan LP dulu."); return; }
  try{ localStorage.setItem(CCP_KEY, JSON.stringify({plat, lp})); }catch(e){}
  render();
}
async function acquireWake(){
  try{ if('wakeLock' in navigator && !autoAbsen.wake){ autoAbsen.wake = await navigator.wakeLock.request('screen'); autoAbsen.wake.addEventListener('release',()=>{ autoAbsen.wake=null; }); } }catch(e){}
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && autoAbsen.on) acquireWake(); });
function startAutoAbsen(silent){
  const d = DB.get(), prof = getCcProfile();
  if(autoAbsen.on) return;
  if(d.yardLocation.lat==null){ if(!silent) alert("Lokasi yard belum diatur Admin."); return; }
  if(!prof.plat || !prof.lp){ if(!silent) alert("Simpan dulu nomor polisi & LP truk kamu."); return; }
  if(!navigator.geolocation){ if(!silent) alert("HP ini tidak mendukung GPS."); return; }
  try{ const ctx = new (window.AudioContext||window.webkitAudioContext)(); ctx.resume(); }catch(e){}
  requestNotifPermission();
  autoAbsen = { on:true, id:null, wake:null, state:"armed", hits:0, dist:null, acc:null, ts:0, msg:"", err:"" };
  try{ localStorage.setItem(CCAUTO_KEY,"1"); }catch(e){}
  acquireWake();
  autoAbsen.id = navigator.geolocation.watchPosition(onAutoPos, onAutoErr, {enableHighAccuracy:true, maximumAge:5000, timeout:30000});
  if(!silent) render();
}
function stopAutoAbsen(silent){
  if(autoAbsen.id!=null){ try{ navigator.geolocation.clearWatch(autoAbsen.id); }catch(e){} }
  try{ if(autoAbsen.wake) autoAbsen.wake.release(); }catch(e){}
  autoAbsen = { on:false, id:null, wake:null, state:"armed", hits:0, dist:null, acc:null, ts:0, msg:"", err:"" };
  try{ localStorage.removeItem(CCAUTO_KEY); }catch(e){}
  if(!silent) render();
}
function onAutoErr(err){
  if(err && err.code===1){ autoAbsen.err = "Izin lokasi ditolak. Aktifkan izin lokasi (pilih 'Izinkan') lalu aktifkan ulang."; updateAutoStatus(); }
}
function onAutoPos(pos){
  if(!autoAbsen.on) return;
  const d = DB.get(), y = d.yardLocation; if(y.lat==null) return;
  const dist = haversineKm(pos.coords.latitude, pos.coords.longitude, y.lat, y.lng);
  autoAbsen.dist = dist; autoAbsen.acc = pos.coords.accuracy; autoAbsen.ts = Date.now(); autoAbsen.err = "";
  if(autoAbsen.state==="done"){
    if(dist > y.radiusKm + 1){ autoAbsen.state = "armed"; autoAbsen.hits = 0; autoAbsen.msg = ""; }   // sudah keluar area → siap absen untuk ritase berikutnya
    updateAutoStatus(); return;
  }
  if(pos.coords.accuracy > 300){ updateAutoStatus(); return; }     // sinyal GPS terlalu kasar, abaikan
  autoAbsen.hits = dist <= y.radiusKm ? autoAbsen.hits+1 : 0;
  if(autoAbsen.hits >= 2) doAutoRegister(dist); else updateAutoStatus();
}
function doAutoRegister(dist){
  const prof = getCcProfile();
  const res = registerCC(prof.plat, prof.lp, dist, true);
  autoAbsen.state = "done";
  autoAbsen.msg = res.dup ? `Truk ${prof.plat} sudah tercatat di stall / antrian.`
                : res.stall ? `✔ Absen otomatis berhasil — ${prof.plat} masuk STALL ${res.stall}. Silakan masuk area.`
                : `⏳ Absen otomatis berhasil — semua stall penuh, ${prof.plat} masuk antrian nomor ${res.queue}.`;
  playAlarmSound();
  if(navigator.vibrate) navigator.vibrate([300,150,300,150,300]);
  if('Notification' in window && Notification.permission==='granted'){
    try{ new Notification('📍 Absen Otomatis Berhasil', {body: autoAbsen.msg}); }catch(e){}
  }
  render();
}
function autoStatusHtml(){
  const y = DB.get().yardLocation, a = autoAbsen;
  if(!a.on) return `<div class="msg info">Absen otomatis belum aktif.</div>`;
  if(a.err) return `<div class="msg err">${a.err}</div>`;
  if(a.state==="done") return `<div class="msg ok">${a.msg}</div><div style="font-size:11px;color:var(--text-dim);">Pantau tetap jalan. Absen otomatis siap lagi begitu kamu keluar area dan kembali.</div>`;
  const dist = a.dist==null ? "mencari sinyal GPS…" : `${a.dist.toFixed(1)} km dari yard${a.acc!=null?` · akurasi ±${Math.round(a.acc)} m`:""}`;
  return `<div class="msg info"><b>🟢 Aktif — menunggu masuk radius ${y.radiusKm} km</b><br><span id="autoDist">${dist}</span></div>`;
}
function updateAutoStatus(){ const el = document.getElementById("autoStatus"); if(el) el.innerHTML = autoStatusHtml(); }

function absenManual(){
  if(!confirm("Absen manual tidak mengecek lokasi dan akan ditandai 'MANUAL' di antrian. Lanjutkan?")) return;
  absenState = {verified:true, distanceKm:null, manual:true};

}
function checkAbsenLocation(){
  const data = DB.get();

  }

  navigator.geolocation.getCurrentPosition(

function ccCardsHtml(data){
  let html = "";
  for(let i=1;i<=CONFIG.CC_TOTAL;i++){
    const isEmergency = CONFIG.CC_EMERGENCY.includes(i);
    const isOpen = !isEmergency || data.ccOpen[i];
    const occ = data.cc[i];
    if(!isOpen){
      html += `<div class="cccard closed"><div class="num">STALL ${i}</div><div class="status" style="color:var(--text-dim);">DITUTUP</div><div class="lp">Cadangan/darurat</div></div>`;
    }else if(occ){
      html += `<div class="cccard filled"><div class="num">STALL ${i}</div><div class="status">TERISI</div><div class="plat">${occ.plat}</div><div class="lp">${occ.lp||''}</div></div>`;
    }else{
      html += `<div class="cccard empty"><div class="num">STALL ${i}</div><div class="status">KOSONG</div><div class="lp">TERSEDIA</div></div>`;
    }
  }
  return html;
}
/* Daftarkan truk ke stall kosong / antrian. Return {stall:n} | {queue:n} | {dup:true} */
function registerCC(plat, lp, dist, auto, manual){
  let res = null; const k = normPlat(plat);
  DB.set(d=>{
    if(Object.values(d.cc).some(c=>c && normPlat(c.plat)===k) || d.queue.some(q=>normPlat(q.plat)===k)){ res = {dup:true}; return; }
    let order = [...CONFIG.CC_ACTIVE_DEFAULT];
    CONFIG.CC_EMERGENCY.forEach(n=>{ if(d.ccOpen[n]) order.push(n); });
    let assigned = null;
    for(const n of order){ if(!d.cc[n]){ assigned = n; break; } }
    if(assigned){ d.cc[assigned] = {plat, lp, ts: Date.now(), absenDistKm: dist, auto:!!auto, manual:!!manual}; res = {stall:assigned}; }
    else{ d.queue.push({plat, lp, ts: Date.now(), absenDistKm: dist, auto:!!auto, manual:!!manual}); res = {queue:d.queue.length}; }
  });
  return res;
}
function submitOrderStall(){
  const plat = document.getElementById("ccPlat").value.trim().toUpperCase();
  const lp = document.getElementById("ccLP").value.trim();
  const msgEl = document.getElementById("orderMsg");
  if(!plat || !lp){ msgEl.innerHTML = `<div class="msg err">Nomor polisi & nama LP wajib diisi.</div>`; return; }

  const res = registerCC(plat, lp, absenState.distanceKm, false, !!absenState.manual);
  if(res.dup) msgEl.innerHTML = `<div class="msg info">Truk ${plat} sudah terdaftar di stall / antrian.</div>`;
  else if(res.stall) msgEl.innerHTML = `<div class="msg ok">✔ Truk ${plat} masuk STALL ${res.stall}. Silakan masuk area.</div>`;
  else msgEl.innerHTML = `<div class="msg info">⏳ Semua stall penuh. Truk ${plat} masuk antrian nomor ${res.queue}.</div>`;
  document.getElementById("ccPlat").value = "";
  document.getElementById("ccLP").value = "";
  absenState = {verified:false, distanceKm:null};
}

/* ===== DRAFT ILS OTOMATIS =====
   Aturan: 1 CC = 1 stall penuh (6 unit), urut FIFO (stall yang paling dulu penuh). Batam & reguler tidak dicampur.
   Stall belum penuh → menunggu (kecuali MP pilih "Kirim sisa unit"). */
let draftType = {};            // {ccNum: "B"|"R"} override manual jenis muatan
function stallStats(data){
  const g = {};
  for(const [k,u] of Object.entries(data.units||{})){ if(!u || isOffKey(k) || u.ilsId) continue; (g[groupOf(k)] = g[groupOf(k)] || []).push([k,u]); }
  return Object.entries(g).map(([st,arr])=>{
    arr.sort((a,b)=>a[0].localeCompare(b[0]));
    const b = arr.filter(([k,u])=>u.batam).length, ts = arr.map(a=>a[1].ts||0);
    return {stall:st, units:arr.map(a=>a[0]), n:arr.length, firstTs:Math.min(...ts), fullTs:Math.max(...ts), batam:b, reg:arr.length-b, mixed:b>0 && b<arr.length};
  });
}
function ccProposals(data){
  const stats = stallStats(data), used = new Set(), out = [], ccs = [];
  for(let i=1;i<=CONFIG.CC_TOTAL;i++){ if(data.cc[i]) ccs.push({n:i, c:data.cc[i]}); }
  ccs.sort((a,b)=>(a.c.ts||0)-(b.c.ts||0));
  for(const {n,c} of ccs){
    if((data.ils||[]).some(b=>b.status==="open" && b.ccNum==n && normPlat(b.ccPlat)===normPlat(c.plat))) continue;
    const row = (data.dccpSchedule||[]).find(r=>normPlat(r.police)===normPlat(c.plat));
    const wantB = draftType[n]!==undefined ? draftType[n]==="B" : /batam/i.test((row&&row.dest)||"");
    const cand = stats.filter(x=>!used.has(x.stall) && !x.mixed && (wantB ? x.batam>0 : x.reg>0));
    const full = cand.filter(x=>x.n>=CONFIG.SLOTS_PER_STALL).sort((a,b)=>a.fullTs-b.fullTs)[0];
    const base = {n, plat:c.plat, lp:c.lp||"", driver:(row&&row.driver)||"", batam:wantB, ccTs:c.ts||0, dismissed:!!c.dismissed, waiting:!!c.waiting};
    if(full){ used.add(full.stall); out.push({...base, ready:true, stall:full.stall, units:full.units.slice(0,CONFIG.MAX_LOAD_PER_CC), have:full.n}); }
    else{ const best = cand.slice().sort((a,b)=>b.n-a.n||a.firstTs-b.firstTs)[0]; out.push({...base, ready:false, stall:best?best.stall:null, units:best?best.units:[], have:best?best.n:0}); }
  }
  return out;
}
function draftGo(n){ const p = ccProposals(DB.get()).find(x=>x.n===n); if(p && p.ready && createILS(n, p.units)){ delete draftType[n]; render(); } }
function draftWait(n){ DB.set(d=>{ if(d.cc[n]) d.cc[n].waiting = true; }); }
function draftSendRest(n, noConfirm){
  const p = ccProposals(DB.get()).find(x=>x.n===n);
  if(!p || !p.units.length){ alert("Tidak ada unit tersisa untuk jenis ini."); return; }
  if(!noConfirm && !confirm(`Kirim ${p.units.length} unit dari stall ${p.stall} (kurang dari ${CONFIG.SLOTS_PER_STALL}) ke CC ${p.plat}?`)) return;
  if(createILS(n, p.units)){ delete draftType[n]; render(); }
}
function draftDismiss(n, on){ DB.set(d=>{ if(d.cc[n]) d.cc[n].dismissed = !!on; }); }
function draftSetType(n, t){ draftType[n] = t; render(); }
function draftCardsHtml(data){
  const P = ccProposals(data); if(!P.length) return "";
  const chips = p=>p.units.map(k=>{ const u = data.units[k]; return u?`<span class="dchip">${u.frame.slice(-6)} · ${u.model}${u.prio?" ⭐":""}</span>`:""; }).join("");
  const typeSw = p=>`<div style="display:flex;gap:6px;margin:6px 0;"><span style="font-size:11px;color:var(--text-dim);align-self:center;">Muatan:</span>
      <button class="linechip ${!p.batam?'on':''}" style="padding:4px 12px;font-size:12px;" onclick="draftSetType(${p.n},'R')">Reguler</button>
      <button class="linechip ${p.batam?'on':''}" style="padding:4px 12px;font-size:12px;" onclick="draftSetType(${p.n},'B')">🟠 Batam</button></div>`;
  return `<div class="dl-draft">` + P.map(p=>{
    const who = `LP <b>${p.lp||"-"}</b> · <b>${p.plat}</b>${p.driver?` · Driver <b>${p.driver}</b>`:""}`;

    if(p.ready) return `<div class="card" style="border:2px solid var(--green);background:#F3FBF6;">
      <h3 style="color:var(--green);">🚚 CC Siap Loading — Draft ILS</h3>
      <div style="font-size:14px;line-height:1.5;">${who}<br>Siap loading unit di <b style="font-size:17px;">Stall ${p.stall}</b> · ${p.units.length} unit${p.batam?` <span style="background:#E8833A;color:#fff;border-radius:4px;padding:1px 7px;font-size:11px;font-weight:800;">BATAM</span>`:""}</div>
      ${typeSw(p)}<div class="dchips">${chips(p)}</div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="btn btn-primary" style="flex:2;" onclick="draftGo(${p.n})">✔ Lanjutkan — Buat ILS</button>
        <button class="btn btn-outline" style="flex:1;" onclick="draftDismiss(${p.n},true)">✕ Batalkan</button>
      </div></div>`;
    const info = p.units.length ? `Stall <b>${p.stall}</b> baru <b>${p.have}/${CONFIG.SLOTS_PER_STALL}</b> unit.` : `Belum ada unit ${p.batam?"Batam":"reguler"} yang siap (stall masih kosong).`;
    if(!p.waiting) return `<div class="card" style="border:2px solid #E8833A;background:#FFF8EF;">
      <h3 style="color:#C9661A;">🚚 CC Siap Loading — Stall Belum Penuh</h3>

      ${typeSw(p)}${p.units.length?`<div class="dchips">${chips(p)}</div>`:""}
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
        ${p.units.length?`<button class="btn btn-primary" style="flex:2;min-width:150px;" onclick="draftSendRest(${p.n},true)">✔ Tetap Buat ILS (${p.units.length} unit)</button>`:""}
        <button class="btn btn-outline" style="flex:1;min-width:110px;" onclick="draftWait(${p.n})">⏳ Menunggu</button>
        <button class="btn btn-outline" style="flex:1;min-width:90px;" onclick="draftDismiss(${p.n},true)">✕ Batalkan</button>
      </div></div>`;
    return `<div class="card" style="border:2px dashed var(--gold-dim);">
      <h3>⏳ Menunggu Stall Penuh</h3>
      <div style="font-size:14px;line-height:1.5;">${who}<br>${info} Kamu akan diberi notifikasi lagi begitu stall penuh.</div>
      ${typeSw(p)}
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
        ${p.units.length?`<button class="btn btn-outline btn-sm" style="flex:1;" onclick="draftSendRest(${p.n})">Tetap buat sekarang (${p.units.length})</button>`:""}
        <button class="btn btn-outline btn-sm" style="flex:1;" onclick="draftDismiss(${p.n},true)">✕ Batalkan</button>
      </div></div>`;
  }).join("") + `</div>`;
}
/* Alarm + notifikasi ke MP Delivery saat ada CC siap loading dengan stall penuh (aplikasi harus terbuka) */
let _draftSeen = new Set(); try{ _draftSeen = new Set(JSON.parse(localStorage.getItem("apcc_draftseen")||"[]")); }catch(e){}
function checkDraftAlerts(){
  if(!currentUser || currentUser.role!=="delivery") return;
  const P = ccProposals(DB.get()).filter(p=>!p.dismissed); let fired = false;
  for(const p of P){
    let key, txt;
    const who = `LP ${p.lp||"-"} ${p.plat}${p.driver?` · Driver ${p.driver}`:""}`;
    if(p.ready){ key = `${normPlat(p.plat)}|${p.ccTs}|${p.stall}`; txt = `${who} siap loading unit di stall ${p.stall} (penuh ${p.units.length} unit). Lanjutkan atau Batalkan?`; }
    else if(!p.waiting){ key = `${normPlat(p.plat)}|${p.ccTs}|wait`; txt = `${who} siap loading, tapi ${p.units.length?`stall ${p.stall} baru ${p.have}/${CONFIG.SLOTS_PER_STALL}`:"belum ada unit siap"}. Tetap buat ILS atau menunggu?`; }
    else continue;
    if(_draftSeen.has(key)) continue;
    _draftSeen.add(key); fired = true;
    playAlarmSound(); if(navigator.vibrate) navigator.vibrate([300,150,300,150,300]);
    if('Notification' in window && Notification.permission==='granted'){ try{ new Notification('🚚 CC Siap Loading', {body:txt}); }catch(e){} }
  }
  if(fired){
    try{ localStorage.setItem("apcc_draftseen", JSON.stringify([..._draftSeen].slice(-200))); }catch(e){}
    const a = document.activeElement, typing = a && (a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT");
    if(activeTab==="delivery" && !typing) render();
  }
}
function finalizeILS(id){
  DB.set(d=>{
    const batch = d.ils.find(b=>b.id===id);
    if(!batch) return;
    batch.status = "done"; batch.doneTs = Date.now();
    batch.units.forEach(u=>{ if(isOffKey(u.slot)) delete d.units[u.slot]; else d.units[u.slot] = null; });
  });
}

function koordStatusList(data){
  const out=[];
  for(let i=1;i<=CONFIG.CC_TOTAL;i++){
    const c=data.cc[i]; if(!c) continue;
    const ils=(data.ils||[]).filter(b=>b.status==="open" && b.ccNum==i && normPlat(b.ccPlat)===normPlat(c.plat)).sort((a,b)=>b.ts-a.ts)[0]||null;
    const row=(data.dccpSchedule||[]).find(r=>normPlat(r.police)===normPlat(c.plat));
    out.push({n:i, plat:c.plat, lp:c.lp||"", driver:(row&&row.driver)||"", absenTs:c.ts||0, ils});
  }
  return out.sort((a,b)=>(b.ils?1:0)-(a.ils?1:0) || (a.ils?a.ils.ts:a.absenTs)-(b.ils?b.ils.ts:b.absenTs));
}
function koordStatusHtml(data){
  const L=koordStatusList(data), hhmm=t=>new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  const ready=L.filter(x=>x.ils).length;
  const items=L.map(x=>{
    const who=`LP ${x.lp||"-"} · ${x.plat}${x.driver?` · Driver ${x.driver}`:""}`;
    const steps=`<div class="steps"><span class="ok">✔ Absen ${hhmm(x.absenTs)}</span><span class="${x.ils?'ok':''}">${x.ils?'✔ ILS dibuat '+hhmm(x.ils.ts):'ILS belum dibuat'}</span><span>Validasi unit</span><span>Kosongkan stall</span></div>`;
    if(x.ils){
      const stalls=[...new Set(x.ils.units.map(u=>u.loc?'luar stall':groupOf(u.slot)))].join(", ");
      return `<div class="kitem"><b>✅ ILS sudah dibuat — siap validasi unit</b><div style="font-size:13px; margin-top:4px;">${who}</div><div style="font-size:12px; color:var(--text-dim); margin-top:2px;">Stall CC ${x.n} · ${x.ils.units.length} unit${x.ils.batam?' (BATAM)':''} dari stall ${stalls} · oleh ${x.ils.mp||'-'}</div>${steps}</div>`;
    }
    return `<div class="kitem wait"><b>⏳ CC sudah absen — ILS belum dibuat</b><div style="font-size:13px; margin-top:4px;">${who}</div><div style="font-size:12px; color:var(--text-dim); margin-top:2px;">Stall CC ${x.n} · menunggu Delivery membuat ILS</div>${steps}</div>`;
  }).join("");
  return `<div class="card kstatus"><h3>📋 Status Loading CC${ready?` <span class="badge gold">${ready} siap validasi</span>`:''}</h3>${L.length?items:'<div class="emptystate">Belum ada CC di stall.</div>'}</div>`;
}
let _koordSeen=new Set(); try{ _koordSeen=new Set(JSON.parse(localStorage.getItem("apcc_koordseen")||"[]")); }catch(e){}
function checkKoordAlerts(){
  if(!currentUser || currentUser.role!=="koordinator") return;
  const L=koordStatusList(DB.get()); let fired=false;
  for(const x of L){
    const who=`LP ${x.lp||"-"} ${x.plat}${x.driver?` · Driver ${x.driver}`:""}`;
    const evs=[[`abs|${normPlat(x.plat)}|${x.absenTs}`, `CC sudah absen: ${who} (Stall CC ${x.n}).`]];
    if(x.ils) evs.push([`ils|${x.ils.id}`, `ILS sudah dibuat: ${who} · ${x.ils.units.length} unit di Stall CC ${x.n}. Siap validasi unit.`]);
    for(const [key,txt] of evs){
      if(_koordSeen.has(key)) continue;
      _koordSeen.add(key); fired=true;
      playAlarmSound(); if(navigator.vibrate) navigator.vibrate([250,120,250]);
      if('Notification' in window && Notification.permission==='granted'){ try{ new Notification(key.startsWith('ils')?'🧾 ILS Dibuat':'🚚 CC Absen',{body:txt}); }catch(e){} }
    }
  }
  if(fired){
    try{ localStorage.setItem("apcc_koordseen", JSON.stringify([..._koordSeen].slice(-300))); }catch(e){}
    const a=document.activeElement, typing=a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT");
    if(activeTab==="koordinator" && !typing) render();
  }
}
function renderKoordinator(){
  const data = DB.get();
  let cards = "";
  for(let i=1;i<=CONFIG.CC_TOTAL;i++){
    const isEmergency = CONFIG.CC_EMERGENCY.includes(i);
    const isOpen = !isEmergency || data.ccOpen[i];
    const occ = data.cc[i];
    cards += `<div class="card" style="margin-bottom:10px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <b>Stall CC ${i}</b> ${isEmergency?'<span class="badge gold">Darurat</span>':''}<br>
          <span style="font-size:12px; color:var(--text-dim);">
            ${!isOpen ? 'Ditutup oleh Admin' : (occ ? `${occ.plat} · ${occ.lp}` : 'Kosong / Tersedia')}
          </span>
        </div>
        ${occ ? `<button class="btn btn-danger btn-sm" onclick="kosongkanCC(${i})">Kosongkan</button>` : ''}
      </div>
    </div>`;
  }

  const queueCards = data.queue.map((q,idx)=>`
    <div class="card" style="margin-bottom:10px;">
      <b>#${idx+1} · ${q.plat}</b><br><span style="font-size:11px; color:var(--text-dim);">${q.lp} · ${new Date(q.ts).toLocaleTimeString('id-ID')}</span>
      ${q.absenDistKm!=null ? `<div style="font-size:11px; color:var(--green); margin-top:4px;">📍 Absen ${q.absenDistKm.toFixed(1)} km dari yard</div>` : (q.manual ? `<div style="font-size:11px; color:var(--gold); margin-top:4px;">✍ Absen manual</div>` : "")}
    </div>`).join("");

  return `
    ${koordStatusHtml(data)}
    <div class="card">
      <h3>🧭 Kelola Stall Car Carrier</h3>
      <p style="font-size:12px; color:var(--text-dim);">Kosongkan stall setelah truk CC benar-benar keluar area. Antrian berikutnya otomatis masuk.</p>
    </div>
    ${cards}
    <div class="card">
      <h3>⏳ Waiting List</h3>
      ${data.queue.length===0? `<div class="emptystate">Tidak ada antrian.</div>` : ''}
    </div>
    ${queueCards}
  `;
}
function kosongkanCC(num){
  DB.set(d=>{
    d.cc[num] = null;
    if(d.queue.length>0){
      const next = d.queue.shift();
      d.cc[num] = {plat: next.plat, lp: next.lp, ts: Date.now()};
    }
  });
}
function toggleEmergency(num){
  DB.set(d=>{ d.ccOpen[num] = !d.ccOpen[num]; if(!d.ccOpen[num]) d.cc[num]=null; });
}

let defectPhotoDataUrl = null;

function handleDefectPhoto(evt){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const show = url=>{
      defectPhotoDataUrl = url;
      const preview = document.getElementById("defectPhotoPreview");
      if(preview) preview.innerHTML = `<img src="${defectPhotoDataUrl}" style="width:100%; max-width:220px; border-radius:10px; margin-top:8px; display:block;">`;
    };
    // kecilkan foto (maks 800px, JPEG 0.6) supaya ringan disinkronkan ke semua HP
    const img = new Image();
    img.onload = function(){
      try{
        const sc = Math.min(1, 800/Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        show(c.toDataURL("image/jpeg",0.6));
      }catch(err){ show(e.target.result); }
    };
    img.onerror = function(){ show(e.target.result); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function gv(varName){
  return getComputedStyle(document.documentElement).getPropertyValue(varName).trim() || '#ccc';

function getCarZone(vbX,vbY){
  // pintu depan kiri terbuka
  if(vbX>=6 && vbX<=60 && vbY>=132 && vbY<=195) return {part:"Opening Door", side:"Kiri", position:"Depan"};
  // pintu belakang kiri terbuka
  if(vbX>=6 && vbX<=60 && vbY>=200 && vbY<=260) return {part:"Opening Door", side:"Kiri", position:"Belakang"};
  // pintu depan kanan terbuka
  if(vbX>=240 && vbX<=294 && vbY>=132 && vbY<=195) return {part:"Opening Door", side:"Kanan", position:"Depan"};
  // pintu belakang kanan terbuka
  if(vbX>=240 && vbX<=294 && vbY>=200 && vbY<=260) return {part:"Opening Door", side:"Kanan", position:"Belakang"};
  // backdoor terbuka
  if(vbX>=80 && vbX<=220 && vbY>=420 && vbY<=460) return {part:"Opening Door — Backdoor", side:"", position:"Belakang"};

  // di luar badan mobil (roda, margin) -> abaikan
  if(vbX<60 || vbX>240 || vbY<20 || vbY>420) return {part:"", side:"", position:""};

  let part="", side="", position="";
  if(vbY<40){ part="Bumper Depan"; position="Depan"; }
  else if(vbY<92){ part="Kap Mesin"; position="Depan"; }
  else if(vbY<132){ part="Kaca Depan"; position="Depan"; }
  else if(vbY<198){ part="Pintu Depan"; position="Depan"; side=vbX<150?"Kiri":"Kanan"; }
  else if(vbY<229){ part="Pintu Tengah"; side=vbX<150?"Kiri":"Kanan"; }
  else if(vbY<268){ part="Pintu Belakang"; position="Belakang"; side=vbX<150?"Kiri":"Kanan"; }
  else if(vbY<299){ part="Kaca Belakang"; position="Belakang"; }
  else if(vbY<352){ part="Backdoor"; position="Belakang"; }
  else{ part="Bumper Belakang"; position="Belakang"; }
  return {part, side, position};
}
